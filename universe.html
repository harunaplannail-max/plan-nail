<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>GALAXY OF NAIL — Plan.nail Taxonomy</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Kosugi&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#efe9f2;--dim:rgba(239,233,242,.55);--line:rgba(239,233,242,.18);--acc:#d9c6e8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#05050a;color:var(--ink);font-family:'Inter','Kosugi',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
/* 上のタイトル */
.top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 18px) 18px 0;text-align:center;pointer-events:none;z-index:5}
.top h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(20px,6.4vw,30px);letter-spacing:.16em;padding:0 46px;
  background:linear-gradient(180deg,#fbf6f2 0%,#d9cfd6 45%,#9c90a2 60%,#efe6ea 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 6px rgba(0,0,0,.7))}
.top h1 .sm{font-size:.72em;letter-spacing:.12em}
.top p{font-family:'Cormorant Garamond',serif;font-size:10px;letter-spacing:.42em;color:var(--dim);margin-top:6px;display:flex;align-items:center;justify-content:center;gap:10px}
.top p::before,.top p::after{content:'';width:42px;height:1px;background:linear-gradient(90deg,transparent,rgba(239,233,242,.45),transparent)}
/* 左上の小さなイコライザー(音の気配) */
.eq{position:fixed;top:calc(env(safe-area-inset-top) + 66px);left:16px;display:flex;align-items:flex-end;gap:2px;height:26px;z-index:5;pointer-events:none;opacity:.55}
.eq i{width:2px;background:linear-gradient(to top,rgba(239,233,242,.15),rgba(239,233,242,.9));animation:eqb 1.2s ease-in-out infinite alternate}
@keyframes eqb{from{height:15%}to{height:100%}}
/* 右上のボタン */
.tools{position:fixed;top:calc(env(safe-area-inset-top) + 16px);right:14px;display:flex;flex-direction:column;gap:8px;z-index:6}
.tools button,.back{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(10,10,18,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--ink);font-size:15px;cursor:pointer}
.back{position:fixed;top:calc(env(safe-area-inset-top) + 16px);left:14px;z-index:6;display:none;font-size:16px}
.zoom{position:fixed;right:28px;top:calc(env(safe-area-inset-top) + 118px);width:2px;height:90px;background:var(--line);z-index:6;border-radius:2px}
.zoom i{position:absolute;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--ink);transition:top .2s}
/* 3Dのラベル(本物の文字) */
.lbl{position:fixed;left:0;top:0;transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap;z-index:3;transition:opacity .3s}
.lbl.planet{font-family:'Cormorant Garamond',serif;font-size:19px;letter-spacing:.14em;text-shadow:0 0 12px rgba(0,0,0,.9)}
.lbl.sat{font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.06em;color:#e6dcea;text-shadow:0 0 8px #000}
.lbl.small{font-size:10px;letter-spacing:.12em;color:var(--dim);text-shadow:0 0 8px #000}
/* 音楽ジャンル:星図の星の名前のように、小さな星の点と一緒に */
.lbl.music{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;letter-spacing:.06em;color:#cbbfd8;text-shadow:0 0 8px #000}
.lbl.music::before{content:'✦ ';font-style:normal;font-size:8px;color:#fff;opacity:.7}
/* 下のタブ */
.tabs{position:fixed;left:0;right:0;bottom:0;padding:10px 8px calc(env(safe-area-inset-bottom) + 12px);display:flex;justify-content:space-around;z-index:6;
  background:linear-gradient(to top,rgba(5,5,10,.85),rgba(5,5,10,0))}
.tabs button{background:none;border:none;color:var(--dim);font-size:9.5px;letter-spacing:.18em;padding:8px 2px;cursor:pointer;font-family:'Cormorant Garamond',serif;font-size:10.5px;letter-spacing:.1em}
@media (max-width:380px){.tabs .star{display:none}}
.tabs .star{color:rgba(239,233,242,.5);font-size:9px;align-self:center}
.tabs::before{content:'';position:absolute;left:14px;right:14px;top:4px;height:1px;background:linear-gradient(90deg,transparent,rgba(239,233,242,.3),transparent)}
.tabs button.on{color:var(--ink)}
/* 詳細・一覧のシート */
.sheet{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 58px);max-width:520px;margin:0 auto;max-height:46vh;overflow:auto;z-index:7;
  padding:16px 16px 14px;border-radius:22px;
  /* ほぼ透明のリキッドグラス(サイトと同じガラスの設定)。後ろの惑星が透けて見える */
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.015) 45%,rgba(255,255,255,.04));
  backdrop-filter:blur(2.5px) saturate(172%) brightness(1.08);-webkit-backdrop-filter:blur(2.5px) saturate(172%) brightness(1.08);
  border:1px solid rgba(255,255,255,.17);
  box-shadow:inset 0 1.5px 2px rgba(255,255,255,.45), inset 0 -8px 16px -8px rgba(255,255,255,.22), 0 20px 40px -18px rgba(0,0,0,.6);
  transform:translateY(130%);transition:transform .45s cubic-bezier(.2,.9,.25,1);touch-action:pan-y}
.sheet:not(.show){transform:translateY(calc(100% + 140px));opacity:0;pointer-events:none}
.sheet.show{transform:none;opacity:1}
.sheet .x{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer}
.sheet *{text-shadow:0 1px 6px rgba(0,0,0,.75),0 0 2px rgba(0,0,0,.6);}
.sheet small{display:block;font-size:9px;letter-spacing:.28em;color:var(--dim)}
.sheet h2{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:26px;letter-spacing:.08em;margin:4px 0 2px}
.sheet .jp{font-family:'Kosugi',sans-serif;font-size:12px;color:var(--acc)}
.sheet p{font-family:'Kosugi',sans-serif;font-size:12.5px;line-height:1.8;color:#d8d0dc;margin-top:8px}
.sheet .rel-music{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;letter-spacing:.06em;color:var(--dim);margin-top:16px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08)}
.sheet .rel-music b{font-style:normal;font-family:'Inter',sans-serif;font-weight:400;font-size:8.5px;letter-spacing:.24em;margin-right:8px}
.sheet .backto{display:inline-flex;align-items:center;gap:6px;margin-bottom:8px;padding:4px 10px 4px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.04);color:var(--ink);font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.08em;cursor:pointer}
.sheet h3{font-size:9px;letter-spacing:.28em;color:var(--dim);font-weight:400;margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-family:'Cormorant Garamond',serif;font-size:13.5px;letter-spacing:.04em;padding:5px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.04);box-shadow:inset 0 1px 1px rgba(255,255,255,.3);color:var(--ink);cursor:pointer}
.chips button.link{border-color:rgba(217,198,232,.5)}
.hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 64px);text-align:center;font-size:10px;letter-spacing:.2em;color:var(--dim);z-index:4;pointer-events:none;transition:opacity 1s}
.closing{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 84px);text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;color:var(--dim);z-index:4;pointer-events:none;transition:opacity 1s}
.load{position:fixed;inset:0;background:#05050a;display:flex;align-items:center;justify-content:center;z-index:20;font-family:'Cormorant Garamond',serif;letter-spacing:.3em;font-size:14px;color:var(--dim);transition:opacity .8s}

/* ── 作品ギャラリー(月を選ぶと、ガラスのパネルが奥行きをもって浮かぶ) ── */
.gallery{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 82px);height:36vh;z-index:5;display:none;perspective:900px}
/* 作品ギャラリーが開いているときは、説明カードを下に小さくまとめて、写真と重ならないように */
body.gal-open .sheet{max-height:calc(100vh - 36vh - env(safe-area-inset-top) - 82px - env(safe-area-inset-bottom) - 58px - 22px)}
.gallery.show{display:block}
.gal-rail{height:100%;display:flex;align-items:center;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 calc(50% - 26vw);scrollbar-width:none;touch-action:pan-x}
.gal-rail::-webkit-scrollbar{display:none}
.panel{flex:0 0 52vw;max-width:260px;height:88%;scroll-snap-align:center;scroll-snap-stop:always;border-radius:16px;position:relative;cursor:pointer;
  background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.2);
  backdrop-filter:blur(2.5px) saturate(172%) brightness(1.08);-webkit-backdrop-filter:blur(2.5px) saturate(172%) brightness(1.08);
  box-shadow:inset 0 1.5px 2px rgba(255,255,255,.4),0 26px 50px -18px rgba(0,0,0,.75);transform-style:preserve-3d;transition:opacity .2s;will-change:transform;overflow:hidden}
.panel img{position:absolute;inset:10px 10px 34px;width:calc(100% - 20px);height:calc(100% - 44px);object-fit:contain;display:block}
.panel span{position:absolute;left:12px;right:12px;bottom:10px;font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.06em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 6px #000}
.panel.empty{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;cursor:default}
.panel.empty b{font-weight:400;font-family:'Cormorant Garamond',serif;font-size:15px;letter-spacing:.3em;color:var(--dim)}
.panel.empty i{font-style:normal;font-size:10px;color:var(--dim);font-family:'Kosugi'}
/* 惑星を選んだとき、まわりに浮かぶ小さな作品 */
.orbit-thumb{position:fixed;left:0;top:0;width:46px;height:58px;border-radius:9px;z-index:3;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .5s;
  border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.04);box-shadow:0 10px 20px -8px rgba(0,0,0,.7)}
.orbit-thumb img{width:100%;height:100%;object-fit:contain}
/* 作品の詳細(全画面)。開いている間は宇宙の操作を止める */
.art{position:fixed;inset:0;z-index:30;display:none;background:rgba(4,4,8,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.art.show{display:block}
.art-stage{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 56px);height:56vh;overflow:hidden;touch-action:none;display:flex;align-items:center;justify-content:center}
.art-stage img{max-width:92%;max-height:100%;object-fit:contain;transform-origin:center;transition:transform .15s;border-radius:6px;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.art-close{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font-size:18px;z-index:2}
.art-count{position:absolute;top:calc(env(safe-area-inset-top) + 22px);left:18px;font-size:10px;letter-spacing:.25em;color:var(--dim)}
.art-info{position:absolute;left:0;right:0;bottom:0;max-height:34vh;overflow:auto;padding:14px 20px calc(env(safe-area-inset-bottom) + 18px);touch-action:pan-y}
.art-info h2{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:24px;letter-spacing:.08em}
.art-info dl{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;margin-top:10px;font-size:11px}
.art-info dt{letter-spacing:.22em;color:var(--dim);font-size:9px;padding-top:3px}
.art-info dd{font-family:'Cormorant Garamond','Kosugi',serif;font-size:14px;letter-spacing:.04em}
.pinbar{display:inline-flex;align-items:center;gap:16px;margin-top:12px;padding:9px 16px;border-radius:999px;background:rgba(20,18,26,.72);border:1px solid rgba(255,255,255,.12);font-family:'Inter',sans-serif;font-size:14px;color:#f2eef4}
.pinbar span{display:inline-flex;align-items:center;gap:6px}
.pinbar svg{width:20px;height:20px;stroke:#f2eef4;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.art-info p{font-family:'Kosugi';font-size:12px;line-height:1.8;color:#d8d0dc;margin-top:10px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="load" id="load">ENTERING THE UNIVERSE…</div>
<div class="top"><h1>GALAXY <span class="sm">OF</span> NAIL</h1><p>PLAN.NAIL TAXONOMY</p></div>
<button class="back" id="back" aria-label="宇宙に戻る">←</button>
<div class="tools"><button id="home" aria-label="最初の位置に戻す">⌂</button></div>
<div class="zoom"><i id="zoomDot"></i></div>
<div id="labels"></div>
<p class="closing" id="closing">Fashion, tattoo, and nail — all grew up with music.</p>
<p class="hint" id="hint">DRAG · PINCH · TAP A PLANET</p>
<div class="sheet" id="sheet"><button class="x" id="sheetX">×</button><div id="sheetBody"></div></div>
<div class="gallery" id="gallery"><div class="gal-rail" id="galRail"></div></div>
<div class="art" id="art"><span class="art-count" id="artCount"></span><button class="art-close" id="artClose" aria-label="閉じる">×</button>
  <div class="art-stage" id="artStage"><img id="artImg" alt=""></div><div class="art-info" id="artInfo"></div></div>
<nav class="tabs" id="tabs">
  <span class="star">✦</span><button data-tab="universe" class="on">UNIVERSE</button><span class="star">✦</span>
  <button data-tab="categories">CATEGORIES</button><span class="star">✦</span>
  <button data-tab="motifs">MOTIFS</button><span class="star">✦</span>
  <button data-tab="textures">TEXTURES</button><span class="star">✦</span>
  <button data-tab="trends">TRENDS</button><span class="star">✦</span>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   NAIL ART UNIVERSE — COSMIC WORLD EXPANSION
   PLANETS=5大分類(恒久) / MOONS=サブジャンル / COMETS=トレンド(移ろう)
   ASTEROIDS=モチーフ / NEBULAE=質感・技法 / CONSTELLATIONS=ジャンル同士の関係
   ============================================================ */

// 言語:スマホの言語設定が日本語以外なら、英語で表示する
// 言語:スマホの言語設定に合わせる(日本語・英語・韓国語・中国語の繁体字/簡体字・タイ語・スペイン語。それ以外は英語)
const LANG = (function(){ const l=((navigator.languages&&navigator.languages[0])||navigator.language||'ja').toLowerCase();
  if(l.startsWith('ja')) return 'ja'; if(l.startsWith('ko')) return 'ko'; if(l.startsWith('th')) return 'th'; if(l.startsWith('es')) return 'es';
  if(l.startsWith('zh')) return (/(tw|hk|mo|hant)/.test(l)) ? 'zh-Hant' : 'zh-Hans';
  return 'en'; })();
const EN = LANG!=='ja';
// 文章の切り替え:日本語ならja、それ以外は各言語の訳(なければ英語)

const L10N = {"ko": {"categories": {"romantic": ["여성스러움", "시어, 펄, 장미처럼 부드럽고 유기적인 아름다움. 빛을 투과시키는 섬세함이 핵심입니다."], "metallic": ["질감 · 구조", "마그넷, 크롬, 클리어. 소재 자체의 질감과 빛의 구조로 보여 주는 장르입니다."], "dark": ["내성적", "「아름답지 않음」이 아니라 「내성적」. 음영, 탐미, 숭고, 반항. 기념비처럼 아름다운 고요한 어둠입니다."], "natural": ["피부톤 · 시대를 타지 않는", "누드, 베이지, 밀크. 애쓰지 않은 듯 보이는 완벽함. 콰이어트 럭셔리의 흐름입니다."], "revival": ["시대의 재해석", "Y2K, 펑크, 헤이세이 노스탤지어. 지나간 시대를 지금의 감각으로 다시 그리는 장르입니다."]}, "motifs": {"patterns": "패턴", "ethnic": "민족 패턴", "decoration": "장식 요소", "creatures": "생물 · 캐릭터", "flowers": "꽃", "flame": "불꽃"}, "motifNotes": {"creatures": ["에일리언: 귀엽고 우주적 → METALLIC", "에일리언: 기묘하고 일그러진 → DARK"], "flowers": ["장미: 로맨틱한 해석 → ROMANTIC", "장미 · 난초: 어두운 식물의 해석 → DARK"], "flame": ["레트로 · 핫로드 → REVIVAL", "어두운 그래피티의 불꽃 → DARK / Street"]}, "textures": {"glaze": ["글레이즈", "클린 걸 룩에서 시작된, 피부에 녹아드는 부드럽고 크리미한 윤기."], "chrome": ["크롬", "Y2K와 갸루 문화. 거울 같은 금속의 윤기. 얼음 네일은 평면에서 빛을 반사하고, 물광 네일은 안쪽에서 빛이 번집니다."], "sea": ["바다", "조개껍데기, 비늘, 물결. 2026년 여름 트렌드."], "tumblr": ["텀블러", "2010년대 텀블러의 공기. 구름, 갤럭시, 굵은 글리터, 소프트 그런지."], "grunge": ["그런지 기법", "번짐과 대리석 같은 무늬. 네일은 윤곽이 남기에, 인상파와 덥 음악의 중간 같은 표현입니다."]}, "trends": {"rosalie": "장미를 모티프로 한 ROMANTIC 계열의 트렌드. 서양적이고 달콤한 꽃의 코어.", "lotus": "연꽃 · 물 · 비취. 동양적이고 광물 같은 질감의 민트, 현대판 인상파. Rosalie Core 곁을 지나갑니다.", "mauve": "톤다운 퍼플과 어두운 퍼플에, 밝은 퍼플을 포인트로. 해석에 따라 여러 행성을 오갑니다.", "mintwave": "헤이세이 노스탤지어에서 이어진 민트의 흐름. 여기서 Lotus Core가 태어났습니다. 민트색 꼬리를 끌며, 어느 행성에도 속하지 않고 떠돕니다."}, "relationships": {"c1": "유기적인 부드러움 ⇔ 기계적인 단단함", "c2": "내성 ⇔ 애쓰지 않은 듯한 완벽함", "c3": "애쓰지 않은 듯한 완벽함 ⇔ 시대의 재해석", "c4": "얼터너티브, 펑크, 그런지. 반항과 시대의 재해석이 이어집니다", "c5": "Y2K의 미학, 전자 음악, 레트로 퓨처"}, "statement": {"PLAN": "Plan이라는 이름에는, 네일 너머에 목적이 있다는 마음을 담았습니다. 네일을 하는 것만이 전부가 아니라고요. 흔히 듣는 PDCA 사이클(Plan · Do · Check · Act = 계획 · 실행 · 평가 · 개선) 같은 이미지가 현실적이겠지만, 처음에는 Plan이 planet(행성)이 되고, planetarium(플라네타리움)으로 자라 간다면 재미있겠다고, 조금은 우주 정복 같은 상상도 했습니다.", "WITH YOU": "음악과 패션에 장르가 있듯이, 네일에도 다양한 디자인이 있습니다. 많은 손님들과의 만남을 통해, 이렇게나 많은 표현이 가능하다는 것을 손님과 함께 만들어 왔습니다. 세계 곳곳의 트렌드와 컬처를 알아 가면서, 리스펙트를 잊지 않고, 저 자신도 그 당사자로서 각각을 잇는 허브 같은 존재가 되고 싶습니다.", "WHY A GALAXY": "게임 「스카이림」의 스킬 트리를 알고 있나요? 스카이림에서는 주인공의 검술이나 마법 같은 기술이 밤하늘의 별자리로 그려져 있습니다. 기술을 쓸수록 실력이 늘고, 새로운 능력을 익힐 때마다 별자리의 별이 하나씩 켜지는 구조입니다. 제 안의 지식과 기술도 그와 같이, 조금씩 가지를 뻗으며 늘어 갑니다. 그것은 우주가 넓어지는 것 같기도 하고, 뉴런에서 시냅스가 뻗어 나가 이어지는 감각과도 닮았습니다. 그 넓어짐을 하나로 모아, 눈에 보이는 형태로 만들어 보고 싶었습니다.", "HOW IT IS MAPPED": "분류의 축은 「기법의 가까움」과 「톤의 가까움(어둠 ⇔ 밝음)」 두 가지입니다. 같은 기법이라도 톤이 다르면 다른 행성에 두었습니다. 유행은 혜성처럼 나타났다 사라지고, 모티프는 어느 행성이든 오갈 수 있습니다. 하지만 다섯 개의 행성은 움직이지 않습니다.", "FROM COMET TO STAR": "트렌드는 이윽고 정석의 아트로. 그것은 혜성이 충돌을 거듭하며 언젠가 별이 되어 가는 것 같은. 그런 로망을 저는 느끼고 있습니다.", "HIGHLIGHTS": "행성은 저마다 다른 소재로 이루어져 있습니다. 진주층의 ROMANTIC, 액체 금속의 METALLIC, 검은 암석의 DARK, 공기의 NATURAL, 홀로그램의 REVIVAL. 마주 보는 행성을 잇는 별자리와, 멀리서 조용히 빛나는 트렌드 아카이브, 가끔 나타나는 UFO도 찾아보세요.", "MUSIC": "패션과 타투가 음악과 함께 자라 왔듯이, 네일도 그 곁에 있습니다. 펑크, 그런지, 고스, 힙합. 네일 장르의 대부분은 음악 씬에서 태어났습니다. 당신이 좋아하는 음악의 행성은 어디에 있나요?", "THANK YOU": "이 은하 어딘가에서 당신의 「좋아함」을 찾았다면, 그것이 저의 가장 큰 기쁨입니다. 이 은하를 여행해 주셔서 감사합니다."}, "ui": {"A motif is never locked to one genre. Depending on execution, tone and context, it can belong to several planets.": "모티프는 하나의 장르에 고정되지 않습니다. 표현 방식 · 톤 · 맥락에 따라 여러 행성으로 기울 수 있습니다.", "Classified by both closeness of technique and closeness of tone (dark ⇔ light).": "기법의 가까움과 톤의 가까움(어둠 ⇔ 밝음) 두 가지로 분류하고 있습니다.", "An asteroid belt crossing the whole galaxy. It meets every planet.": "은하 전체를 가로지르는 소행성대. 모든 행성과 만납니다.", "Nebulae drifting between the planets, overlapping many genres.": "행성 사이를 떠도는 성운. 여러 장르에 겹칩니다.", "Trends appear like comets, pass by the planets and drift away. The five planets never move.": "유행은 혜성처럼 나타나 행성 곁을 지나, 이윽고 멀리로. 다섯 개의 행성은 움직이지 않습니다.", "Nothing yet": "아직 없습니다", "Photographs will be added soon": "작품 사진은 곧 추가됩니다", "The constellation the UFO comes from, and its sword nebula": "UFO가 찾아오는 별자리와 검의 성운", "A constellation shaped like Orion. A pink and violet nebula floats near its sword. The UFO that appears now and then comes from this nebula, and returns to it.": "오리온자리 같은 모습의 별자리. 검 근처에 핑크와 보라색 성운이 떠 있습니다. 가끔 나타나는 UFO는 이 성운에서 찾아와, 다시 이곳으로 돌아갑니다.", "Unidentified nails that fit nowhere in the classification. Cute and cosmic leads to METALLIC; uncanny and distorted leads to DARK.": "분류 어디에도 들어가지 않는 미확인 네일. 귀엽고 우주적이면 METALLIC으로, 기묘하게 일그러지면 DARK로.", "Unidentified nails": "미확인 네일", "METALLIC — cute & cosmic": "METALLIC — 귀엽고 우주적", "DARK — uncanny & distorted": "DARK — 기묘하고 일그러진", "See artworks (": "작품 보기 (", "Category: ": "분류: ", "Artworks (": "작품 (", "Leave this galaxy and return to the Plan home page?": "이 은하를 떠나 Plan 홈 화면으로 돌아갈까요?", "Return home →": "홈으로 돌아가기 →", "Stay in this galaxy": "이 은하에 머무르기", "It belongs to no planet and drifts freely through the galaxy.": "어느 행성에도 속하지 않고, 우주를 자유롭게 떠돌고 있습니다.", "View on Instagram →": "Instagram에서 보기 →", "View on Pinterest →": "Pinterest에서 보기 →", "A meteor shower — a cultural current": "유성우 · 문화의 흐름", "WHY A DESIGN IS WORN": "디자인을 하는 이유", "Its light reaches every planet": "그 빛은 모든 행성에 닿는다", "A current that belongs to no planet and drifts through the galaxy. Colliding again and again, it may one day be drawn into a planet of design and become a classic.": "어느 행성에도 속하지 않고 우주를 떠도는 흐름. 충돌을 거듭하며, 언젠가 디자인의 행성에 녹아들어 정석의 디자인이 되기도 합니다."}}, "zh-Hant": {"categories": {"romantic": ["女性特質", "如透膚色、珍珠與玫瑰般，柔和而有機的美。核心在於讓光穿透的細膩。"], "metallic": ["質感 · 結構", "磁吸、鏡面、透明。以材質本身的質感與光的結構來呈現的類型。"], "dark": ["內省", "不是「不美」，而是「內省」。陰翳、耽美、崇高、反骨。如紀念碑般美麗的靜謐黑暗。"], "natural": ["膚色 · 不受時代限制", "裸色、米色、牛奶色。看似毫不費力的完美。屬於 Quiet Luxury 的脈絡。"], "revival": ["時代的再詮釋", "Y2K、龐克、平成懷舊。以現代的感性重新描繪過去時代的類型。"]}, "motifs": {"patterns": "圖案", "ethnic": "民族圖騰", "decoration": "裝飾元素", "creatures": "生物 · 角色", "flowers": "花", "flame": "火焰"}, "motifNotes": {"creatures": ["外星人：可愛、宇宙感 → METALLIC", "外星人：詭異、扭曲 → DARK"], "flowers": ["玫瑰：浪漫的詮釋 → ROMANTIC", "玫瑰 · 蘭花：暗色植物的詮釋 → DARK"], "flame": ["復古 · Hot Rod → REVIVAL", "暗色塗鴉的火焰 → DARK / Street"]}, "textures": {"glaze": ["釉光", "源自 Clean Girl 風格，貼合肌膚、柔和綿密的光澤。"], "chrome": ["鏡面", "Y2K 與辣妹文化。如鏡子般的金屬光澤。冰感美甲在平面反射光線，水光美甲則從內側透出光。"], "sea": ["海", "貝殼、鱗片、水的波動。2026 年夏季趨勢。"], "tumblr": ["Tumblr", "2010 年代 Tumblr 的氛圍。雲朵、銀河、大顆粒亮片、軟頹廢。"], "grunge": ["頹廢技法", "暈染與大理石般的紋路。因為指甲保留輪廓，所以像是介於印象派與 Dub 音樂之間的表現。"]}, "trends": {"rosalie": "以玫瑰為主題、偏 ROMANTIC 的趨勢。西式而甜美的花之核心。", "lotus": "蓮花 · 水 · 翡翠。東方而帶礦物質感的薄荷色，印象派的現代版。在 Rosalie Core 身旁前進。", "mauve": "低彩度紫與深紫，點綴明亮的紫。依詮釋不同，往返於多顆行星之間。", "mintwave": "從平成懷舊延續而來的薄荷色潮流，Lotus Core 由此誕生。拖著薄荷色的尾巴，不屬於任何行星地漂流。"}, "relationships": {"c1": "有機的柔軟 ⇔ 機械的堅硬", "c2": "內省 ⇔ 看似不費力的完美", "c3": "看似不費力的完美 ⇔ 時代的再詮釋", "c4": "另類、龐克、頹廢。反骨與時代的再詮釋相連", "c5": "Y2K 美學、電子音樂、復古未來"}, "statement": {"PLAN": "Plan 這個名字，寄託著「美甲的另一端還有目的」的想法。做美甲並不是全部。常聽到的 PDCA 循環（Plan · Do · Check · Act＝計畫 · 執行 · 評估 · 改善）或許是比較實際的印象，但一開始，我曾想著如果 Plan 能成為 planet（行星），再成長為 planetarium（天文館）會很有趣，有點像征服宇宙那樣的想像。", "WITH YOU": "就像音樂和時尚有類型一樣，美甲也有各式各樣的設計。透過與許多客人的相遇，我和客人一起創造出了如此多的表現可能。在認識世界各地的趨勢與文化的過程中，我希望不忘尊重，也以身為其中一員的身份，成為連結彼此的樞紐般的存在。", "WHY A GALAXY": "你知道遊戲《上古卷軸：天際》的技能樹嗎？在天際裡，主角的劍術、魔法等技能被畫成夜空中的星座。技能用得越多就越熟練，每學會一項新能力，星座裡的星星就會一顆一顆亮起來。我內在的知識與技術也是這樣，一點一點地分枝增長。那像是宇宙在擴張，也像是從神經元延伸出突觸、彼此相連的感覺。我想把這份擴展整合起來，化為看得見的形式。", "HOW IT IS MAPPED": "分類的軸有兩個：「技法的相近」與「色調的相近（暗 ⇔ 亮）」。即使技法相同，色調不同就會放在不同的行星。流行如彗星般出現又離去，主題能在任何行星之間往來。但五顆行星不會移動。", "FROM COMET TO STAR": "趨勢，終將成為經典的藝術。那就像彗星反覆碰撞，某天終於成為星星一樣。我感受到這樣的浪漫。", "HIGHLIGHTS": "每顆行星都由不同的材質構成：珍珠層的 ROMANTIC、液態金屬的 METALLIC、黑色岩石的 DARK、空氣的 NATURAL、全像的 REVIVAL。也請找找連結相對行星的星座、在遠方靜靜發光的趨勢檔案，以及偶爾出現的 UFO。", "MUSIC": "就像時尚與刺青和音樂一起成長，美甲也在它們身旁。龐克、頹廢、哥德、嘻哈。許多美甲類型誕生於音樂場景。你喜歡的音樂的行星，在哪裡呢？", "THANK YOU": "如果你在這個銀河的某處找到了自己的「喜歡」，那就是我最大的喜悅。謝謝你在這個銀河旅行。"}, "ui": {"A motif is never locked to one genre. Depending on execution, tone and context, it can belong to several planets.": "主題不會被固定在一個類型。依照畫法、色調與脈絡，可以屬於多顆行星。", "Classified by both closeness of technique and closeness of tone (dark ⇔ light).": "以技法的相近與色調的相近（暗 ⇔ 亮）兩者來分類。", "An asteroid belt crossing the whole galaxy. It meets every planet.": "橫越整個銀河的小行星帶，與每顆行星交會。", "Nebulae drifting between the planets, overlapping many genres.": "漂浮在行星之間的星雲，與多種類型重疊。", "Trends appear like comets, pass by the planets and drift away. The five planets never move.": "流行如彗星般出現，經過行星身旁，終將遠去。五顆行星不會移動。", "Nothing yet": "目前還沒有", "Photographs will be added soon": "作品照片即將加入", "The constellation the UFO comes from, and its sword nebula": "UFO 來自的星座，與劍的星雲", "A constellation shaped like Orion. A pink and violet nebula floats near its sword. The UFO that appears now and then comes from this nebula, and returns to it.": "形似獵戶座的星座。劍的附近漂浮著粉紅與紫色的星雲。偶爾出現的 UFO 從這片星雲而來，也會回到這裡。", "Unidentified nails that fit nowhere in the classification. Cute and cosmic leads to METALLIC; uncanny and distorted leads to DARK.": "無法歸入任何分類的未確認美甲。可愛又帶宇宙感就走向 METALLIC，詭異扭曲就走向 DARK。", "Unidentified nails": "未確認的美甲", "METALLIC — cute & cosmic": "METALLIC — 可愛、宇宙感", "DARK — uncanny & distorted": "DARK — 詭異、扭曲", "See artworks (": "查看作品（", "Category: ": "分類：", "Artworks (": "作品（", "Leave this galaxy and return to the Plan home page?": "要離開這個銀河，回到 Plan 的首頁嗎？", "Return home →": "回到首頁 →", "Stay in this galaxy": "留在這個銀河", "It belongs to no planet and drifts freely through the galaxy.": "不屬於任何行星，在宇宙中自由漂流。", "View on Instagram →": "在 Instagram 查看 →", "View on Pinterest →": "在 Pinterest 查看 →", "A meteor shower — a cultural current": "流星雨・文化的潮流", "WHY A DESIGN IS WORN": "為何選擇這款設計", "Its light reaches every planet": "它的光，抵達每一顆行星", "A current that belongs to no planet and drifts through the galaxy. Colliding again and again, it may one day be drawn into a planet of design and become a classic.": "不屬於任何行星、在宇宙中漂流的潮流。在反覆碰撞之中，有時終將被設計的行星吸納，成為經典設計。"}}, "zh-Hans": {"categories": {"romantic": ["女性特质", "如透肤色、珍珠与玫瑰般，柔和而有机的美。核心在于让光穿透的细腻。"], "metallic": ["质感 · 结构", "磁吸、镜面、透明。以材质本身的质感与光的结构来呈现的类型。"], "dark": ["内省", "不是「不美」，而是「内省」。阴翳、耽美、崇高、反骨。如纪念碑般美丽的静谧黑暗。"], "natural": ["肤色 · 不受时代限制", "裸色、米色、牛奶色。看似毫不费力的完美。属于 Quiet Luxury 的脉络。"], "revival": ["时代的再诠释", "Y2K、庞克、平成怀旧。以现代的感性重新描绘过去时代的类型。"]}, "motifs": {"patterns": "图案", "ethnic": "民族图腾", "decoration": "装饰元素", "creatures": "生物 · 角色", "flowers": "花", "flame": "火焰"}, "motifNotes": {"creatures": ["外星人：可爱、宇宙感 → METALLIC", "外星人：诡异、扭曲 → DARK"], "flowers": ["玫瑰：浪漫的诠释 → ROMANTIC", "玫瑰 · 兰花：暗色植物的诠释 → DARK"], "flame": ["复古 · Hot Rod → REVIVAL", "暗色涂鸦的火焰 → DARK / Street"]}, "textures": {"glaze": ["釉光", "源自 Clean Girl 风格，贴合肌肤、柔和绵密的光泽。"], "chrome": ["镜面", "Y2K 与辣妹文化。如镜子般的金属光泽。冰感美甲在平面反射光线，水光美甲则从内侧透出光。"], "sea": ["海", "贝壳、鳞片、水的波动。2026 年夏季趋势。"], "tumblr": ["Tumblr", "2010 年代 Tumblr 的氛围。云朵、银河、大颗粒亮片、软颓废。"], "grunge": ["颓废技法", "晕染与大理石般的纹路。因为指甲保留轮廓，所以像是介于印象派与 Dub 音乐之间的表现。"]}, "trends": {"rosalie": "以玫瑰为主题、偏 ROMANTIC 的趋势。西式而甜美的花之核心。", "lotus": "莲花 · 水 · 翡翠。东方而带矿物质感的薄荷色，印象派的现代版。在 Rosalie Core 身旁前进。", "mauve": "低彩度紫与深紫，点缀明亮的紫。依诠释不同，往返于多颗行星之间。", "mintwave": "从平成怀旧延续而来的薄荷色潮流，Lotus Core 由此诞生。拖着薄荷色的尾巴，不属于任何行星地漂流。"}, "relationships": {"c1": "有机的柔软 ⇔ 机械的坚硬", "c2": "内省 ⇔ 看似不费力的完美", "c3": "看似不费力的完美 ⇔ 时代的再诠释", "c4": "另类、庞克、颓废。反骨与时代的再诠释相连", "c5": "Y2K 美学、电子音乐、复古未来"}, "statement": {"PLAN": "Plan 这个名字，寄托著「美甲的另一端还有目的」的想法。做美甲并不是全部。常听到的 PDCA 循环（Plan · Do · Check · Act＝计画 · 执行 · 评估 · 改善）或许是比较实际的印象，但一开始，我曾想著如果 Plan 能成为 planet（行星），再成长为 planetarium（天文馆）会很有趣，有点像征服宇宙那样的想像。", "WITH YOU": "就像音乐和时尚有类型一样，美甲也有各式各样的设计。透过与许多客人的相遇，我和客人一起创造出了如此多的表现可能。在认识世界各地的趋势与文化的过程中，我希望不忘尊重，也以身为其中一员的身份，成为连结彼此的枢纽般的存在。", "WHY A GALAXY": "你知道游戏《上古卷轴：天际》的技能树吗？在天际里，主角的剑术、魔法等技能被画成夜空中的星座。技能用得越多就越熟练，每学会一项新能力，星座里的星星就会一颗一颗亮起来。我内在的知识与技术也是这样，一点一点地分枝增长。那像是宇宙在扩张，也像是从神经元延伸出突触、彼此相连的感觉。我想把这份扩展整合起来，化为看得见的形式。", "HOW IT IS MAPPED": "分类的轴有两个：「技法的相近」与「色调的相近（暗 ⇔ 亮）」。即使技法相同，色调不同就会放在不同的行星。流行如彗星般出现又离去，主题能在任何行星之间往来。但五颗行星不会移动。", "FROM COMET TO STAR": "趋势，终将成为经典的艺术。那就像彗星反覆碰撞，某天终于成为星星一样。我感受到这样的浪漫。", "HIGHLIGHTS": "每颗行星都由不同的材质构成：珍珠层的 ROMANTIC、液态金属的 METALLIC、黑色岩石的 DARK、空气的 NATURAL、全像的 REVIVAL。也请找找连结相对行星的星座、在远方静静发光的趋势档案，以及偶尔出现的 UFO。", "MUSIC": "就像时尚与刺青和音乐一起成长，美甲也在它们身旁。庞克、颓废、哥德、嘻哈。许多美甲类型诞生于音乐场景。你喜欢的音乐的行星，在哪里呢？", "THANK YOU": "如果你在这个银河的某处找到了自己的「喜欢」，那就是我最大的喜悦。谢谢你在这个银河旅行。"}, "ui": {"A motif is never locked to one genre. Depending on execution, tone and context, it can belong to several planets.": "主题不会被固定在一个类型。依照画法、色调与脉络，可以属于多颗行星。", "Classified by both closeness of technique and closeness of tone (dark ⇔ light).": "以技法的相近与色调的相近（暗 ⇔ 亮）两者来分类。", "An asteroid belt crossing the whole galaxy. It meets every planet.": "横越整个银河的小行星带，与每颗行星交会。", "Nebulae drifting between the planets, overlapping many genres.": "漂浮在行星之间的星云，与多种类型重叠。", "Trends appear like comets, pass by the planets and drift away. The five planets never move.": "流行如彗星般出现，经过行星身旁，终将远去。五颗行星不会移动。", "Nothing yet": "目前还没有", "Photographs will be added soon": "作品照片即将加入", "The constellation the UFO comes from, and its sword nebula": "UFO 来自的星座，与剑的星云", "A constellation shaped like Orion. A pink and violet nebula floats near its sword. The UFO that appears now and then comes from this nebula, and returns to it.": "形似猎户座的星座。剑的附近漂浮著粉红与紫色的星云。偶尔出现的 UFO 从这片星云而来，也会回到这里。", "Unidentified nails that fit nowhere in the classification. Cute and cosmic leads to METALLIC; uncanny and distorted leads to DARK.": "无法归入任何分类的未确认美甲。可爱又带宇宙感就走向 METALLIC，诡异扭曲就走向 DARK。", "Unidentified nails": "未确认的美甲", "METALLIC — cute & cosmic": "METALLIC — 可爱、宇宙感", "DARK — uncanny & distorted": "DARK — 诡异、扭曲", "See artworks (": "查看作品（", "Category: ": "分类：", "Artworks (": "作品（", "Leave this galaxy and return to the Plan home page?": "要离开这个银河，回到 Plan 的首页吗？", "Return home →": "回到首页 →", "Stay in this galaxy": "留在这个银河", "It belongs to no planet and drifts freely through the galaxy.": "不属于任何行星，在宇宙中自由漂流。", "View on Instagram →": "在 Instagram 查看 →", "View on Pinterest →": "在 Pinterest 查看 →", "A meteor shower — a cultural current": "流星雨・文化的潮流", "WHY A DESIGN IS WORN": "为何选择这款设计", "Its light reaches every planet": "它的光，抵达每一颗行星", "A current that belongs to no planet and drifts through the galaxy. Colliding again and again, it may one day be drawn into a planet of design and become a classic.": "不属于任何行星、在宇宙中漂流的潮流。在反复碰撞之中，有时终将被设计的行星吸纳，成为经典设计。"}}, "th": {"categories": {"romantic": ["ความเป็นผู้หญิง", "ความงามที่นุ่มนวลและเป็นธรรมชาติ เหมือนสีโปร่งแสง ไข่มุก และดอกกุหลาบ หัวใจสำคัญคือความละเอียดอ่อนที่ปล่อยให้แสงลอดผ่าน"], "metallic": ["พื้นผิว · โครงสร้าง", "แม่เหล็ก โครม และสีใส สไตล์ที่ถ่ายทอดผ่านพื้นผิวของวัสดุและโครงสร้างของแสง"], "dark": ["การมองเข้าไปในใจ", "ไม่ใช่ “ความไม่สวย” แต่คือ “การมองเข้าไปในใจ” เงามืด ความงามอันลุ่มหลง ความยิ่งใหญ่ และการต่อต้าน ความมืดอันเงียบสงบที่งดงามดั่งอนุสาวรีย์"], "natural": ["สีผิว · ไร้กาลเวลา", "นู้ด เบจ และสีนม ความสมบูรณ์แบบที่ดูไม่ต้องพยายาม ในแบบ Quiet Luxury"], "revival": ["การตีความยุคสมัยใหม่", "Y2K พังก์ และความคิดถึงยุคเฮเซย์ การวาดยุคสมัยในอดีตขึ้นใหม่ด้วยความรู้สึกของปัจจุบัน"]}, "motifs": {"patterns": "ลวดลาย", "ethnic": "ลายชาติพันธุ์", "decoration": "ของตกแต่ง", "creatures": "สิ่งมีชีวิต · ตัวละคร", "flowers": "ดอกไม้", "flame": "เปลวไฟ"}, "motifNotes": {"creatures": ["เอเลี่ยน: น่ารักและเป็นอวกาศ → METALLIC", "เอเลี่ยน: แปลกประหลาดและบิดเบี้ยว → DARK"], "flowers": ["กุหลาบ: การตีความแบบโรแมนติก → ROMANTIC", "กุหลาบ · กล้วยไม้: การตีความแบบพฤกษามืด → DARK"], "flame": ["เรโทร · ฮอตร็อด → REVIVAL", "เปลวไฟกราฟฟิตี้โทนมืด → DARK / Street"]}, "textures": {"glaze": ["เกลซ", "มาจากลุค Clean Girl ความเงาที่นุ่มนวล ครีมมี่ และกลมกลืนกับผิว"], "chrome": ["โครม", "วัฒนธรรม Y2K และกยารุ ความเงาแบบโลหะเหมือนกระจก เล็บไอซ์สะท้อนแสงบนพื้นผิวเรียบ ส่วนเล็บฉ่ำวาวเปล่งแสงจากภายใน"], "sea": ["ทะเล", "เปลือกหอย เกล็ด และระลอกน้ำ เทรนด์ฤดูร้อนปี 2026"], "tumblr": ["Tumblr", "บรรยากาศของ Tumblr ยุค 2010 เมฆ กาแล็กซี กลิตเตอร์เม็ดใหญ่ และซอฟต์กรันจ์"], "grunge": ["เทคนิคกรันจ์", "ลายที่ซึมเลือนและคล้ายหินอ่อน เพราะเล็บยังคงมีโครงร่าง จึงเป็นการแสดงออกที่อยู่ระหว่างอิมเพรสชันนิสม์กับดนตรีดับ"]}, "trends": {"rosalie": "เทรนด์โทน ROMANTIC ที่มีกุหลาบเป็นโมทีฟ แกนดอกไม้ที่หวานแบบตะวันตก", "lotus": "ดอกบัว น้ำ และหยก มินต์สไตล์ตะวันออกที่มีพื้นผิวคล้ายแร่ อิมเพรสชันนิสม์ฉบับปัจจุบัน เคลื่อนไปข้าง ๆ Rosalie Core", "mauve": "ม่วงหม่นและม่วงเข้ม แต่งด้วยม่วงสว่าง เคลื่อนผ่านหลายดาวเคราะห์ตามการตีความ", "mintwave": "กระแสสีมินต์ที่สืบต่อจากความคิดถึงยุคเฮเซย์ Lotus Core ถือกำเนิดจากที่นี่ ลากหางสีมินต์ ล่องลอยโดยไม่สังกัดดาวเคราะห์ดวงใด"}, "relationships": {"c1": "ความนุ่มนวลแบบธรรมชาติ ⇔ ความแข็งแบบเครื่องจักร", "c2": "การมองเข้าไปในใจ ⇔ ความสมบูรณ์แบบที่ดูไม่ต้องพยายาม", "c3": "ความสมบูรณ์แบบที่ดูไม่ต้องพยายาม ⇔ การตีความยุคสมัยใหม่", "c4": "อัลเทอร์เนทีฟ พังก์ กรันจ์ การต่อต้านเชื่อมกับการตีความยุคสมัยใหม่", "c5": "สุนทรียะ Y2K ดนตรีอิเล็กทรอนิกส์ และเรโทรฟิวเจอร์"}, "statement": {"PLAN": "ชื่อ Plan ใส่ความตั้งใจไว้ว่า เหนือกว่าการทำเล็บยังมีจุดหมายอยู่ การทำเล็บไม่ใช่ทุกอย่าง แม้คำว่า Plan อาจฟังดูเป็นเรื่องจริงจัง เหมือนวงจร PDCA (Plan · Do · Check · Act = วางแผน · ลงมือ · ตรวจสอบ · ปรับปรุง) แต่ในตอนแรกฉันเคยคิดเล่น ๆ ว่า ถ้า Plan เติบโตเป็น planet (ดาวเคราะห์) แล้วกลายเป็น planetarium (ท้องฟ้าจำลอง) ได้ก็คงสนุก เหมือนการพิชิตจักรวาลเลย", "WITH YOU": "เหมือนที่ดนตรีและแฟชั่นมีหลายแนว เล็บก็มีดีไซน์มากมาย ผ่านการได้พบกับลูกค้ามากมาย ฉันได้สร้างการแสดงออกหลากหลายเหล่านี้ร่วมกับลูกค้า ระหว่างที่ได้รู้จักเทรนด์และวัฒนธรรมจากทั่วโลก ฉันอยากเป็นศูนย์กลางที่เชื่อมโยงสิ่งเหล่านั้นเข้าด้วยกัน ในฐานะคนหนึ่งที่อยู่ในวงการนี้ โดยไม่ลืมความเคารพ", "WHY A GALAXY": "คุณรู้จักสกิลทรีในเกม Skyrim ไหม? ใน Skyrim ทักษะของตัวเอกอย่างดาบหรือเวทมนตร์ถูกวาดเป็นกลุ่มดาวบนท้องฟ้ายามค่ำคืน ยิ่งใช้ทักษะมากก็ยิ่งเก่งขึ้น และทุกครั้งที่เรียนรู้ความสามารถใหม่ ดาวในกลุ่มดาวก็จะสว่างขึ้นทีละดวง ความรู้และเทคนิคในตัวฉันก็เติบโตแบบเดียวกัน ค่อย ๆ แตกกิ่งก้านออกไป มันรู้สึกเหมือนจักรวาลที่ขยายออก หรือเหมือนไซแนปส์ที่งอกออกจากเซลล์ประสาทแล้วเชื่อมต่อกัน ฉันอยากรวบรวมการเติบโตนั้นไว้ด้วยกัน และทำให้มองเห็นได้", "HOW IT IS MAPPED": "แกนของการจัดหมวดหมู่มีสองอย่าง คือ “ความใกล้เคียงของเทคนิค” และ “ความใกล้เคียงของโทน (มืด ⇔ สว่าง)” แม้เทคนิคเดียวกัน หากโทนต่างกันก็จะอยู่บนดาวคนละดวง กระแสนิยมปรากฏและจากไปเหมือนดาวหาง และโมทีฟเดินทางไปมาได้ทุกดาว แต่ดาวเคราะห์ทั้งห้าจะไม่เคลื่อนที่", "FROM COMET TO STAR": "เทรนด์จะกลายเป็นงานศิลปะคลาสสิกในที่สุด เหมือนดาวหางที่ชนกันครั้งแล้วครั้งเล่า จนวันหนึ่งกลายเป็นดวงดาว ฉันรู้สึกถึงความโรแมนติกแบบนั้น", "HIGHLIGHTS": "ดาวเคราะห์แต่ละดวงทำจากวัสดุต่างกัน ROMANTIC จากมุก METALLIC จากโลหะเหลว DARK จากหินสีดำ NATURAL จากอากาศ และ REVIVAL จากโฮโลแกรม ลองตามหากลุ่มดาวที่เชื่อมดาวเคราะห์ที่อยู่ตรงข้ามกัน คลังเทรนด์ที่ส่องแสงเงียบ ๆ อยู่ไกลออกไป และ UFO ที่โผล่มาเป็นครั้งคราว", "MUSIC": "เหมือนที่แฟชั่นและรอยสักเติบโตมาพร้อมกับดนตรี เล็บก็อยู่เคียงข้างพวกมัน พังก์ กรันจ์ โกธิก ฮิปฮอป เล็บหลายแนวเกิดขึ้นจากซีนดนตรี ดาวเคราะห์แห่งดนตรีที่คุณชอบอยู่ที่ไหน", "THANK YOU": "หากคุณได้พบ “สิ่งที่ชอบ” ที่ไหนสักแห่งในกาแล็กซีนี้ นั่นคือความสุขที่สุดของฉัน ขอบคุณที่ได้เดินทางในกาแล็กซีนี้"}, "ui": {"A motif is never locked to one genre. Depending on execution, tone and context, it can belong to several planets.": "โมทีฟไม่ได้ถูกผูกไว้กับแนวเดียว ขึ้นอยู่กับวิธีวาด โทน และบริบท จึงอยู่ได้หลายดาว", "Classified by both closeness of technique and closeness of tone (dark ⇔ light).": "จัดหมวดหมู่ตามความใกล้เคียงของเทคนิคและโทน (มืด ⇔ สว่าง)", "An asteroid belt crossing the whole galaxy. It meets every planet.": "แถบดาวเคราะห์น้อยที่พาดผ่านทั้งกาแล็กซี และพบกับดาวทุกดวง", "Nebulae drifting between the planets, overlapping many genres.": "เนบิวลาที่ลอยอยู่ระหว่างดาวเคราะห์ ซ้อนทับกับหลายแนว", "Trends appear like comets, pass by the planets and drift away. The five planets never move.": "กระแสนิยมปรากฏขึ้นเหมือนดาวหาง ผ่านข้างดาวเคราะห์ แล้วลอยห่างไป ดาวเคราะห์ทั้งห้าไม่เคลื่อนที่", "Nothing yet": "ยังไม่มี", "Photographs will be added soon": "รูปผลงานจะเพิ่มเร็ว ๆ นี้", "The constellation the UFO comes from, and its sword nebula": "กลุ่มดาวที่ UFO มาจาก และเนบิวลาที่ดาบ", "A constellation shaped like Orion. A pink and violet nebula floats near its sword. The UFO that appears now and then comes from this nebula, and returns to it.": "กลุ่มดาวรูปร่างคล้ายกลุ่มดาวนายพราน ใกล้ดาบมีเนบิวลาสีชมพูและม่วงลอยอยู่ UFO ที่โผล่มาเป็นครั้งคราวมาจากเนบิวลานี้ และกลับมาที่นี่", "Unidentified nails that fit nowhere in the classification. Cute and cosmic leads to METALLIC; uncanny and distorted leads to DARK.": "เล็บที่ยังระบุไม่ได้ ซึ่งไม่เข้ากับหมวดใดเลย ถ้าน่ารักและเป็นอวกาศจะไปทาง METALLIC ถ้าแปลกประหลาดและบิดเบี้ยวจะไปทาง DARK", "Unidentified nails": "เล็บที่ยังระบุไม่ได้", "METALLIC — cute & cosmic": "METALLIC — น่ารักและเป็นอวกาศ", "DARK — uncanny & distorted": "DARK — แปลกประหลาดและบิดเบี้ยว", "See artworks (": "ดูผลงาน (", "Category: ": "หมวดหมู่: ", "Artworks (": "ผลงาน (", "Leave this galaxy and return to the Plan home page?": "ออกจากกาแล็กซีนี้และกลับไปหน้าแรกของ Plan ไหม?", "Return home →": "กลับหน้าแรก →", "Stay in this galaxy": "อยู่ในกาแล็กซีนี้ต่อ", "It belongs to no planet and drifts freely through the galaxy.": "ไม่สังกัดดาวเคราะห์ดวงใด และล่องลอยอย่างอิสระในกาแล็กซี", "View on Instagram →": "ดูบน Instagram →", "View on Pinterest →": "ดูบน Pinterest →", "A meteor shower — a cultural current": "ฝนดาวตก · กระแสวัฒนธรรม", "WHY A DESIGN IS WORN": "เหตุผลที่เลือกดีไซน์นี้", "Its light reaches every planet": "แสงของมันส่องถึงดาวทุกดวง", "A current that belongs to no planet and drifts through the galaxy. Colliding again and again, it may one day be drawn into a planet of design and become a classic.": "กระแสที่ไม่สังกัดดาวเคราะห์ดวงใดและล่องลอยในกาแล็กซี บางครั้งชนกันครั้งแล้วครั้งเล่า จนวันหนึ่งถูกดึงเข้าสู่ดาวเคราะห์แห่งดีไซน์และกลายเป็นดีไซน์คลาสสิก"}}, "es": {"categories": {"romantic": ["Feminidad", "Una belleza suave y orgánica, como el color translúcido, las perlas y las rosas. Su esencia es una delicadeza que deja pasar la luz."], "metallic": ["Textura y estructura", "Magnético, cromo, transparente. Un género que muestra la textura del propio material y la estructura de la luz."], "dark": ["Introspección", "No es “lo que no es bello”, sino lo introspectivo: sombra, decadencia, lo sublime y la rebeldía. Una oscuridad serena, bella como un monumento."], "natural": ["Tono piel · Atemporal", "Nude, beige, leche. Una perfección que parece no requerir esfuerzo, en el espíritu del quiet luxury."], "revival": ["Reinterpretar épocas", "Y2K, punk y nostalgia de la era Heisei. Volver a dibujar épocas pasadas con la sensibilidad de hoy."]}, "motifs": {"patterns": "Estampados", "ethnic": "Patrones étnicos", "decoration": "Elementos decorativos", "creatures": "Criaturas y personajes", "flowers": "Flores", "flame": "Llamas"}, "motifNotes": {"creatures": ["Alien: tierno y cósmico → METALLIC", "Alien: inquietante y distorsionado → DARK"], "flowers": ["Rosa: interpretación romántica → ROMANTIC", "Rosa · orquídea: interpretación botánica oscura → DARK"], "flame": ["Retro / hot rod → REVIVAL", "Llamas de grafiti oscuro → DARK / Street"]}, "textures": {"glaze": ["Glaseado", "Nacido del look clean girl. Un brillo suave, cremoso y natural como la piel."], "chrome": ["Cromo", "Cultura Y2K y gyaru. Un brillo metálico como un espejo. Las uñas de hielo reflejan la luz en planos lisos; las uñas jugosas brillan desde dentro."], "sea": ["Mar", "Conchas, escamas y agua ondulante. Tendencia del verano de 2026."], "tumblr": ["Tumblr", "El aire del Tumblr de los 2010: nubes, galaxias, glitter grueso y soft grunge."], "grunge": ["Técnicas grunge", "Patrones difuminados, como mármol. Como la uña conserva su contorno, se sitúa entre el impresionismo y la música dub."]}, "trends": {"rosalie": "Una tendencia con rosas como motivo, cercana a ROMANTIC. Un núcleo floral dulce y occidental.", "lotus": "Loto, agua y jade. Un menta oriental con textura mineral: una versión moderna del impresionismo. Viaja junto a Rosalie Core.", "mauve": "Morados apagados y profundos con un acento de morado brillante. Según la interpretación, se mueve entre varios planetas.", "mintwave": "La corriente menta que viene de la nostalgia Heisei. De aquí nació Lotus Core. Arrastra una cola color menta y no pertenece a ningún planeta."}, "relationships": {"c1": "Suavidad orgánica ⇔ dureza mecánica", "c2": "Introspección ⇔ perfección sin esfuerzo", "c3": "Perfección sin esfuerzo ⇔ reinterpretar épocas", "c4": "Alternativo, punk, grunge: la rebeldía se une a la reinterpretación", "c5": "Estética Y2K, música electrónica, retrofuturismo"}, "statement": {"PLAN": "El nombre Plan lleva la idea de que hay un propósito más allá de las uñas. Hacer uñas no lo es todo. “Plan” puede sonar práctico, como el ciclo PDCA (Plan · Do · Check · Act = planificar · hacer · verificar · actuar), pero al principio imaginé que Plan crecía hasta convertirse en un planeta y luego en un planetario. Algo así como conquistar el universo.", "WITH YOU": "Así como la música y la moda tienen géneros, las uñas tienen muchísimos diseños. Al conocer a tantas clientas y clientes, descubrí junto a ellos cuántas formas de expresión son posibles. Mientras aprendo sobre tendencias y culturas de todo el mundo, quiero mantener el respeto y, como parte de estas escenas, ser un punto de unión que las conecte.", "WHY A GALAXY": "¿Conoces los árboles de habilidades del videojuego Skyrim? En Skyrim, las habilidades del protagonista, como la espada o la magia, se dibujan como constelaciones en el cielo nocturno. Cuanto más usas una habilidad, mejor te vuelves, y cada nueva capacidad que aprendes enciende una estrella más de su constelación. Mis conocimientos y técnicas crecen de la misma manera, ramificándose poco a poco. Se siente como un universo que se expande, o como sinapsis que crecen desde las neuronas y se conectan. Quise reunir ese crecimiento y hacerlo visible.", "HOW IT IS MAPPED": "Hay dos ejes: la cercanía de la técnica y la cercanía del tono (oscuro ⇔ claro). Aunque la técnica sea la misma, un tono distinto significa otro planeta. Las tendencias aparecen y se van como cometas, y los motivos viajan entre todos los planetas. Pero los cinco planetas nunca se mueven.", "FROM COMET TO STAR": "Con el tiempo, las tendencias se convierten en arte clásico. Siento en ello un romanticismo, como cometas que chocan una y otra vez hasta que, algún día, se vuelven estrellas.", "HIGHLIGHTS": "Cada planeta está hecho de un material distinto: ROMANTIC de nácar, METALLIC de metal líquido, DARK de roca negra, NATURAL de aire y REVIVAL holográfico. Busca las constelaciones que unen planetas opuestos, el archivo de tendencias que brilla en silencio a lo lejos y el OVNI que aparece de vez en cuando.", "MUSIC": "Así como la moda y el tatuaje crecieron con la música, las uñas viven a su lado. Punk, grunge, gótico, hip hop: muchos géneros de uñas nacieron de escenas musicales. ¿Dónde está el planeta de tu música favorita?", "THANK YOU": "Si encontraste algo que amas en algún lugar de esta galaxia, esa es mi mayor alegría. Gracias por viajar por esta galaxia."}, "ui": {"A motif is never locked to one genre. Depending on execution, tone and context, it can belong to several planets.": "Un motivo nunca queda fijo en un solo género. Según la ejecución, el tono y el contexto, puede pertenecer a varios planetas.", "Classified by both closeness of technique and closeness of tone (dark ⇔ light).": "Clasificado por la cercanía de la técnica y la cercanía del tono (oscuro ⇔ claro).", "An asteroid belt crossing the whole galaxy. It meets every planet.": "Un cinturón de asteroides que cruza toda la galaxia y se encuentra con todos los planetas.", "Nebulae drifting between the planets, overlapping many genres.": "Nebulosas que flotan entre los planetas y se superponen a muchos géneros.", "Trends appear like comets, pass by the planets and drift away. The five planets never move.": "Las tendencias aparecen como cometas, pasan junto a los planetas y se alejan. Los cinco planetas nunca se mueven.", "Nothing yet": "Aún no hay nada", "Photographs will be added soon": "Pronto se añadirán fotografías", "The constellation the UFO comes from, and its sword nebula": "La constelación de donde viene el OVNI y su nebulosa de la espada", "A constellation shaped like Orion. A pink and violet nebula floats near its sword. The UFO that appears now and then comes from this nebula, and returns to it.": "Una constelación con forma de Orión. Cerca de su espada flota una nebulosa rosa y violeta. El OVNI que aparece de vez en cuando viene de esta nebulosa y regresa a ella.", "Unidentified nails that fit nowhere   const out=new THREE.BufferGeometry(); out.setAttribute('position',new THREE.BufferAttribute(pos,3)); out.computeVertexNormals(); return out; }

    const c={x:(a.x+b.x)/2,y:(a.y+b.y)/2}; if(panPrev){ const dx=c.x-panPrev.x, dy=c.y-panPrev.y; panBy(dx,dy); } panPrev=c; } });

  const hits=ray.intersectObjects(clickables,false).filter(x=>!x.object.userData.disabled); if(!hits.length){ if(dbl) goal.radius=Math.max(LIMIT.min,goal.radius*.7); return; }

/* ============================================================
   13. 作品写真(NAIL ARTWORK)。NotionのトレンドデザインDBから読み込む
   「宇宙の惑星」「宇宙のサブジャンル」「モチーフタグ」「質感タグ」「トレンドタグ」「表示順」を付けるだけで、
   宇宙を作り直さずにギャラリーへ出る。1つの作品を複数の分類に入れてもOK
   ============================================================ */
let ARTWORKS = [];
const norm = s => String(s||'').trim().toLowerCase();
fetch('/api/notion?type=trends').then(r=>r.ok?r.json():[]).then(list=>{
  if(!Array.isArray(list)) return;
  ARTWORKS = list.filter(t=>t.universe && (t.universe.planets.length || t.universe.subgenres.length) && (t.thumb || (t.images&&t.images[0])))
    .map(t=>({ id:t.id, title:t.name||'', img:t.thumb||t.images[0], images:t.images||[t.thumb], thumb:t.thumbSmall||t.thumb, desc:t.desc||'',
      planets:t.universe.planets.map(norm), subgenres:t.universe.subgenres, motifs:t.universe.motifs, textures:t.universe.textures, trends:t.universe.trends, order:t.universe.order, pinUrl:t.pinUrl||'', igUrl:t.instagramUrl||'', pinSaves:(typeof t.pinSaves==='number')?t.pinSaves:null, pinViews:(typeof t.pinViews==='number')?t.pinViews:null, pinTaps:(typeof t.pinTaps==='number')?t.pinTaps:null }))
    .sort((a,b)=>a.order-b.order);
}).catch(()=>{});
const TREND_ALIASES={ 'Mint Core':['Mint','Mint Core','ミント'], 'Lotus Core':['Lotus','ロータスコア'], 'Rosalie Core':['Rosalie','ロザリーコア'] };
function artworksFor(kind, key){
  if(kind==='planet') return ARTWORKS.filter(a=>a.planets.includes(key));
  if(kind==='moon') return ARTWORKS.filter(a=>a.subgenres.some(s=>norm(s)===norm(key)));
  if(kind==='motif') return ARTWORKS.filter(a=>a.motifs.some(s=>norm(s)===norm(key)));
  if(kind==='texture') return ARTWORKS.filter(a=>a.textures.some(s=>norm(s)===norm(key)));
  if(kind==='trend'){ // トレンドの作品:トレンドタグに加えて、同じ意味のサブジャンル名も拾う(例:Mint Core ← サブジャンル「Mint」)
    const alias=(TREND_ALIASES[key]||[]).map(norm).concat([norm(key)]);
    return ARTWORKS.filter(a=>a.trends.some(s=>alias.includes(norm(s))) || a.subgenres.some(s=>alias.includes(norm(s)))); }
  return []; }

// Pinterestのアナリティクスと同じ並び(閲覧・タップ・保存)を、アイコン付きの帯で
function fmtCount(n){ if(LANG==='ja'||LANG==='zh-Hant'||LANG==='zh-Hans'){ if(n>=10000) return (Math.round(n/1000)/10).toString().replace(/\.0$/,'')+(LANG==='ja'?'万':'萬'.replace('萬',LANG==='zh-Hans'?'万':'萬')); return n.toLocaleString(); }
  if(n>=1000000) return (Math.round(n/100000)/10)+'M'; if(n>=10000) return (Math.round(n/100)/10)+'K'; return n.toLocaleString(); }
const PIN_ICONS={
  view:'<svg viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3.2"/></svg>',

  save:'<svg viewBox="0 0 24 24"><path d="M9 3h6l-1 6 3 3H7l3-3z"/><path d="M12 12v9"/><path d="M4 20l5-5"/></svg>' };
function pinStats(a){ const items=[]; if(a.pinViews!=null) items.push(PIN_ICONS.view+fmtCount(a.pinViews)); if(a.pinTaps!=null) items.push(PIN_ICONS.tap+fmtCount(a.pinTaps)); if(a.pinSaves!=null) items.push(PIN_ICONS.save+fmtCount(a.pinSaves));
  return items.length?`<div class="pinbar">${items.map(x=>`<span>${x}</span>`).join('')}</div>`:''; }
function applyZoom(){ artImg.style.transform=`translate(${zoom.x}px,${zoom.y}px) scale(${zoom.s})`; }
(function artGestures(){ const pts=new Map(); let start=null, pinch0=0, s0=1, startX=0;
  artStage.addEventListener('pointerdown',e=>{ artStage.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){ start={x:e.clientX,y:e.clientY,zx:zoom.x,zy:zoom.y}; startX=e.clientX; }
    if(pts.size===2){ const [a,b]=[...pts.values()]; pinch0=Math.hypot(a.x-b.x,a.y-b.y); s0=zoom.s; } });
  artStage.addEventListener('pointermove',e=>{ if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){ const [a,b]=[...pts.values()]; zoom.s=Math.min(4,Math.max(1,s0*Math.hypot(a.x-b.x,a.y-b.y)/pinch0)); applyZoom(); }
    else if(pts.size===1 && zoom.s>1 && start){ zoom.x=start.zx+(e.clientX-start.x); zoom.y=start.zy+(e.clientY-start.y); applyZoom(); } });
  const end=e=>{ if(!pts.has(e.pointerId)) return; pts.delete(e.pointerId);
    if(pts.size===0 && zoom.s<=1.02 && start){ const dx=e.clientX-startX; // 拡大していないときだけ、横スワイプで前後の作品へ
      if(dx<-50 && artIndex<galItems.length-1){ artIndex++; renderArt(); } else if(dx>50 && artIndex>0){ artIndex--; renderArt(); } }
    if(zoom.s<=1.02){ zoom={s:1,x:0,y:0}; applyZoom(); } };
  artStage.addEventListener('pointerup',end); artStage.addEventListener('pointercancel',end);
  artStage.addEventListener('dblclick',()=>{ zoom = zoom.s>1 ? {s:1,x:0,y:0} : {s:2.2,x:0,y:0}; applyZoom(); });
})();

/* ---------- 博物館のジオラマのような「スポットライト」 ----------
   下のタブ(CATEGORIES / MOTIFS / TEXTURES / TRENDS)を押したときだけ、宇宙全体をふっと暗くして、
   その説明にあたる天体だけを光らせる。「宇宙のどれのことか」を一目で伝えるため */
const spot={ kind:null, k:0 };
const spotPool=[]; for(let i=0;i<16;i++){ const s=new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex('#ffffff',true), transparent:true, opacity:0, depthWrite:false, depthTest:false, blending:THREE.AdditiveBlending })); s.renderOrder=999; scene.add(s); spotPool.push(s); }
function setSpot(kind){ spot.kind=kind; if(kind){ goal.target.set(0,0,0); goal.radius=homeRadius()*(kind==='motifs'?1.12:1); goal.phi=1.22; followObj=null; } }
function spotTargets(){ // [位置, 大きさ]
  if(spot.kind==='categories') return Object.values(planets).map(p=>[p.group.position, p.data.size*4.2]);
  if(spot.kind==='motifs') return asteroids.map(a=>[wpos(a), 3.4]);
  if(spot.kind==='textures') return nebulae.map(g=>[g.position, 9]);
  if(spot.kind==='trends') return [...trendComets.map(c=>[c.head.position, 3.2]), ...archive.map(a=>[a.sprite.position, 3.2])];
  return []; }
function updateSpot(dt,t){ spot.k += ((spot.kind?1:0)-spot.k)*Math.min(1,dt*4);
  renderer.toneMappingExposure = 1.05 - .72*spot.k; // 全体をふっと暗く
  const tg=spot.kind?spotTargets():[];
  spotPool.forEach((s,i)=>{ const T=tg[i]; if(!T||spot.k<.02){ s.material.opacity=0; return; } s.position.copy(T[0]); s.scale.setScalar(T[1]*(1+Math.sin(t*1.6+i)*.06)); s.material.opacity=.42*spot.k; });
  // 光らせる側は、暗くした分だけ明るさを足して浮かび上がらせる
  nebulae.forEach(g=>g.children.forEach(c=>{ if(c.material && c.material.uniforms && c.material.uniforms.uBoost) c.material.uniforms.uBoost.value = (spot.kind==='textures'?1+1.8*spot.k:1-.5*spot.k); }));
  trendComets.forEach(c=>{ if(spot.kind==='trends'){ c.head.material.opacity=Math.min(1,c.head.material.opacity*(1+1.5*spot.k)); } });
  asteroids.forEach(a=>{ a.material.emissiveIntensity = .4 + (spot.kind==='motifs'?2.2*spot.k:0); });
  Object.values(planets).forEach(p=>{ const m=p.hit.material; if(m && m.emissiveIntensity!==undefined){ if(m.userData.baseE===undefined) m.userData.baseE=m.emissiveIntensity; m.emissiveIntensity = m.userData.baseE + (spot.kind==='categories'?.6*spot.k:0); } });
}

const BELIEF_FRAG=`uniform float uTime; uniform float uPulse; uniform vec3 uA; uniform vec3 uB; uniform vec3 uC; uniform float uSeed; varying vec2 vUv; ${NOISE_GLSL}
float sdSeg(vec2 p, vec2 a, vec2 b){ vec2 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0); return length(pa-ba*h); }
float ridge(float n){ return 1.0-abs(n*2.0-1.0); }
void main(){ vec2 p=(vUv-0.5)*2.0; float r=length(p);
  float t=uTime;
  vec3 q=vec3(p*2.0, t*0.025+uSeed);
  vec2 w=vec2(fbm(q), fbm(q+vec3(5.2,1.3,2.0)))-0.5;
  vec2 pw=p+w*0.28;                                                    // ガスのゆらぎで、形がゆらめく
  // アナーキーマーク(円とA)を、ガスの密度としてだけ持たせる
  vec2 ps=(p+w*0.1)/0.62;                                              // マークは小さめに(星雲の中心に)
  float rt=-0.2; ps=mat2(cos(rt),-sin(rt),sin(rt),cos(rt))*ps;           // 少し傾けて、左右対称をくずす
  float ang=atan(ps.y,ps.x);
  float ring=abs(length(ps*vec2(1.0,1.08))-(0.5+0.04*sin(ang*3.0+1.3)));  // いびつな円
  float sa=sdSeg(ps,vec2(0.07,0.68),vec2(-0.52,-0.56)), sb=sdSeg(ps,vec2(0.07,0.68),vec2(0.38,-0.66)), sc=sdSeg(ps,vec2(-0.32,-0.02),vec2(0.3,-0.17)); // 脚の長さも横棒の傾きも不ぞろいに
  float sym=min(ring,min(sa,min(sb,sc)))*0.62;
  float symMask=exp(-pow(sym/0.04,2.0));
  symMask*=0.35+0.65*smoothstep(0.25,0.55,fbm(vec3(pw*3.2,uSeed+7.0+t*0.02)));     // ところどころ途切れて、闇に消える
  float rid=pow(ridge(fbm(vec3(pw*5.5,uSeed+t*0.02))),4.0);             // 枝分かれする細い筋
  float rid2=pow(ridge(fbm(vec3(pw*12.0,uSeed*1.7-t*0.03))),5.0);
  float grain=pow(ridge(fbm(vec3(pw*26.0,uSeed*2.3+t*0.02))),6.0);   // 細かなざらつき(写真のような粒立ち)
  float cloud=fbm(vec3(pw*2.2,uSeed+3.0+t*0.012));
  vec2 jd=normalize(vec2(1.0,0.72)); vec2 pj=p+w*0.45; float along=dot(pj,jd), perp=abs(dot(pj,vec2(-jd.y,jd.x))); // 流れも、ガスと一緒にうねる
  float jet=exp(-pow(perp/(0.09+abs(along)*0.18),2.0))*smoothstep(1.4,0.75,abs(along))*smoothstep(0.3,0.6,abs(along)); // 斜めに噴き出す流れ
  float fall=smoothstep(1.3,0.2,r);
  float body=smoothstep(0.12,0.58,cloud)*fall*(0.4+1.4*rid)+rid2*fall*0.6+grain*fall*0.45;  // まわりの星雲をたっぷり
  float inner=symMask*(0.1+rid*1.1+rid2*1.0)*smoothstep(0.7,0.1,r);
  float jstreak=fbm(vec3(along*1.6-t*0.05, perp*16.0, uSeed+11.0)); float jetA=jet*(0.35+1.8*smoothstep(0.35,0.8,jstreak));
  float lanes=1.0-0.75*smoothstep(0.5,0.78,fbm(vec3(pw*3.0,uSeed+21.0+t*0.01)));   // 暗い塵の筋(すき間)
  body*=lanes;
  vec3 col=uA*cloud*fall*0.2*lanes + uA*body*0.5 + uB*(rid*fall*0.32*lanes+jetA*0.5) + uC*inner*(0.7+uPulse*0.6) + uA*jetA*0.35;
  col+=vec3(0.85,0.92,1.0)*exp(-r*40.0)*(1.0+uPulse*1.4);              // 中性子星のまわりの光
  float a=clamp(cloud*fall*0.3*lanes+body*0.7+inner*0.85+jetA*0.6+exp(-r*28.0),0.0,1.0);
  gl_FragColor=vec4(col, a); }
`;
const beliefObjs=[];
function makeBelief(B){ const g=new THREE.Group(); g.position.set(...B.pos); scene.add(g);
  const C=k=>new THREE.Color(B.colors[k]);
  const mat=new THREE.ShaderMaterial({ transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    uniforms:{ uTime:{value:0}, uPulse:{value:0}, uSeed:{value:B.seed}, uA:{value:C('outer')}, uB:{value:C('mid')}, uC:{value:C('inner')} },
    vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:BELIEF_FRAG.replace('gl_FragColor=vec4(col, a);','gl_FragColor=vec4(col*a, a);') });
  const neb=new THREE.Mesh(new THREE.PlaneGeometry(B.size,B.size), mat); g.add(neb);           // いつも見る人の方を向く星雲
  const star=new THREE.Sprite(new THREE.SpriteMaterial({ map:crossStarTex(), color:0xdfe8ff, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending })); star.scale.setScalar(2.2); g.add(star); // 中性子星
  // 中心から外へ漂う細かな粒
  const PN=120, pp=new Float32Array(PN*3), parts=[]; for(let k=0;k<PN;k++) parts.push({ d:new THREE.Vector3(rnd(-1,1),rnd(-1,1),rnd(-.3,.3)).normalize(), t:rnd(0,1), v:rnd(.03,.08) });
  const pg=new THREE.BufferGeometry(); pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
  const pts=new THREE.Points(pg,new THREE.PointsMaterial({ color:C('inner').lerp(new THREE.Color('#ffffff'),.4), size:.12, transparent:true, opacity:.55, depthWrite:false, blending:THREE.AdditiveBlending })); g.add(pts);
  const hit=new THREE.Mesh(new THREE.SphereGeometry(B.size*.28,10,8), new THREE.MeshBasicMaterial({ visible:false })); hit.userData={kind:'belief',data:B}; g.add(hit); clickables.push(hit);
  const lab=new THREE.Object3D(); lab.position.set(0,-B.size*.36,0); g.add(lab); addLabel(B.name,lab,'small','beliefs');
  const O={ B, g, neb, mat, star, pts, pp, parts, hit, aur:null, nextAur:rnd(6,12) }; beliefObjs.push(O); return O; }
TAXONOMY.beliefs.forEach(makeBelief);
// オーロラのような光:ときどき星雲から、ゆるやかな曲線を描いて惑星の方へ伸び、惑星をその色でふわっと照らして消える
function auroraTo(O, P){ const from=O.g.position.clone(), to=P.group.position.clone(); const dir=to.clone().sub(from), len=dir.length();
  const end=from.clone().addScaledVector(dir, 1-(P.data.size*1.8)/len);                                     // 惑星の手前で止まる
  const mid=from.clone().lerp(end,.5).add(new THREE.Vector3(rnd(-1,1),rnd(.3,1),rnd(-1,1)).multiplyScalar(len*.18));
  const curve=new THREE.QuadraticBezierCurve3(from,mid,end); const SEG=80, W=O.B.size*.12;
  const pos=new Float32Array((SEG+1)*2*3), uv=new Float32Array((SEG+1)*2*2), idx=[]; const up=new THREE.Vector3(0,1,0);
  for(let i=0;i<=SEG;i++){ const u=i/SEG, p=curve.getPoint(u), tn=curve.getTangent(u); const side=new THREE.Vector3().crossVectors(tn,up).normalize().multiplyScalar(W*(1-u*.6));
    pos.set([p.x-side.x,p.y-side.y-W*.3,p.z-side.z, p.x+side.x,p.y+side.y+W*.3,p.z+side.z],i*6); uv.set([u,0,u,1],i*4); if(i<SEG){ const a=i*2; idx.push(a,a+1,a+2, a+1,a+3,a+2); } }
  const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(pos,3)); geo.setAttribute('uv',new THREE.BufferAttribute(uv,2)); geo.setIndex(idx);
  const m=new THREE.ShaderMaterial({ transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide,
    uniforms:{ uTime:{value:0}, uProg:{value:0}, uFade:{value:1}, uA:{value:new THREE.Color(O.B.colors.outer)}, uB:{value:new THREE.Color(O.B.colors.mid)}, uC:{value:new THREE.Color(O.B.colors.inner)} },
    vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`uniform float uTime; uniform float uProg; uniform float uFade; uniform vec3 uA; uniform vec3 uB; uniform vec3 uC; varying vec2 vUv; ${NOISE_GLSL}
      void main(){ float front=smoothstep(uProg,uProg-0.12,vUv.x);                                       // 光が先へ伸びていく
        float curtain=fbm(vec3(vUv.x*14.0-uTime*0.8, vUv.y*2.0, 3.0));                                    // オーロラのカーテンの縦の筋
        float edge=sin(3.14159*vUv.y); float a=front*uFade*edge*(0.25+0.75*curtain)*smoothstep(0.0,0.08,vUv.x)*(1.0-vUv.x*0.35);
        vec3 col=mix(uA,uB,smoothstep(0.0,0.5,vUv.x)); col=mix(col,uC,smoothstep(0.5,1.0,vUv.x));
        gl_FragColor=vec4(col*a*0.55, a*0.55); }` });
  const mesh=new THREE.Mesh(geo,m); scene.add(mesh);
  const tint=new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex('#ffffff',true), color:new THREE.Color(O.B.colors.inner).lerp(new THREE.Color(O.B.colors.outer),.4), transparent:true, opacity:0, depthWrite:false, blending:THREE.AdditiveBlending }));
  tint.scale.setScalar(P.data.size*3.4); P.group.add(tint);
  O.aur={ mesh, m, tint, P, t:0 }; }
function updateBeliefs(t,dt){ beliefObjs.forEach(O=>{
    const ph=(t%O.B.pulse)/O.B.pulse, pulse=Math.exp(-ph*5)*(1-Math.exp(-ph*60));                          // 鋭く光って、ゆっくり引く脈動
    O.mat.uniforms.uTime.value=t; O.mat.uniforms.uPulse.value=pulse; O.neb.quaternion.copy(camera.quaternion);
    O.star.scale.setScalar(1.6+pulse*1.6); O.star.material.opacity=.7+pulse*.3;
    O.parts.forEach((q,k)=>{ q.t+=dt*q.v; if(q.t>1) q.t=0; const r=O.B.size*.06+q.t*O.B.size*.42; O.pp[k*3]=q.d.x*r; O.pp[k*3+1]=q.d.y*r; O.pp[k*3+2]=q.d.z*r; }); O.pts.geometry.attributes.position.needsUpdate=true;
    if(!O.aur){ O.nextAur-=dt; if(O.nextAur<=0){ const ids=Object.keys(planets); auroraTo(O, planets[ids[Math.floor(Math.random()*ids.length)]]); } return; }
    const A=O.aur; A.t+=dt; A.m.uniforms.uTime.value=t;
    A.m.uniforms.uProg.value=Math.min(1.15,A.t/4.5);                                                      // 4.5秒かけて惑星へ伸びる
    const fade = A.t<6 ? 1 : Math.max(0,1-(A.t-6)/3); A.m.uniforms.uFade.value=fade;                       // 届いたら、ゆっくり消える
    A.tint.material.opacity = A.t>3.8 ? Math.min(.35, (A.t-3.8)*.3)*fade : 0;                               // 惑星が、その色でふわっと照らされる
    if(A.t>9){ scene.remove(A.mesh); A.mesh.geometry.dispose(); A.m.dispose(); A.P.group.remove(A.tint); O.aur=null; O.nextAur=rnd(14,26); } }); }
function openBelief(B,obj){ enterDetail(); followObj=null; goal.target.copy(wpos(obj)); goal.radius=B.size*1.25; setSelected(null); linkGroup.clear(); highlightConstellations(null);
  openSheet(`<small>BELIEF AXIS · ${tr('思想の軸','WHY A DESIGN IS WORN')}</small><h2>${B.name}</h2><div class="jp">${B.tags}</div>
    <p style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px">“${B.quote}”</p><p>${tr(B.desc,B.descEn||B.quote)}</p>
    <h3>${tr('思想の光は、どの惑星にも届く','Its light reaches every planet')}</h3>`); }

/* ---------- 12. 毎フレーム ---------- */
const v3=new THREE.Vector3(), zoomDot=document.getElementById('zoomDot');
let hintHidden=false; function hideHint(){ if(hintHidden) return; hintHidden=true; document.getElementById('hint').style.opacity=0; }
function labelVisible(L){ const s=L.show;
  if(spot.kind && spot.k>.3){ // スポットライト中は、光っているものの名前だけ
    if(spot.kind==='categories') return s==='always';
    if(spot.kind==='motifs') return s==='asteroids';
    if(spot.kind==='textures') return s==='nebulae';
    if(spot.kind==='trends') return s==='comets'||s==='archive';
  }
  if(s==='always') return true;
  // ホームより引いて見ているときは、惑星の名前だけにする(文字が重なってごちゃつかないように)
  if(mode==='universe' && tab!=='motifs' && tab!=='textures' && tab!=='trends' && cam.radius>homeRadius()*1.06) return false;
  if(s.startsWith('planet:')) return (mode!=='universe'&&focus===s.slice(7)) || camera.position.distanceTo(wpos(L.obj))<12;
  if(s==='asteroids') return tab==='motifs'||mode==='detail';
  if(s==='nebulae') return tab==='textures'||cam.radius<24;
  if(s==='comets') return tab==='trends'||selected===L.obj||cam.radius<28;
  if(s==='archive') return tab==='trends'||camera.position.distanceTo(archiveSpot)<40;
  if(s==='core') return mode==='universe';
  if(s==='beliefs') return mode==='universe' || camera.position.distanceTo(wpos(L.obj))<60;
  if(s==='blackhole') return mode==='universe' || tab==='categories';
  if(s==='visitor') return mode==='universe' || camera.position.distanceTo(wpos(VISITOR.neb))<40;
  if(s==='musicAll') return mode==='universe';
  if(s.startsWith('music:')) return focus===s.slice(6) || (mode!=='universe' && camera.position.distanceTo(wpos(L.obj))<16);
  return false; }
let last=performance.now(), frame=0;
function tick(now){ const dt=Math.min(.05,(now-last)/1000), t=now/1000; last=now; frame++;
  if(followObj) goal.target.copy(wpos(followObj));
  cam.target.lerp(goal.target,.07); cam.radius+=(goal.radius-cam.radius)*.07; cam.theta+=(goal.theta-cam.theta)*.12; cam.phi+=(goal.phi-cam.phi)*.12; applyCamera();
  Object.values(planets).forEach(p=>{ p.body.rotation.y+=p.spin*dt; p.moonG.rotation.y+=dt*.12;
    if(p.body.userData.liquid && frame%2===0) updateLiquid(p.body.userData.liquid,t);
    if(p.body.userData.holo && frame%3===0){ updateHolo(p.body.userData.holo,t); p.body.userData.frag.rotation.y-=dt*.2; }
    if(p.body.userData.smoke){ const S=p.body.userData.smoke; S.body.uniforms.uTime.value=t; S.smokeMat.uniforms.uTime.value=t; S.smokeShell.rotation.y+=dt*.04;
      S.puffs.forEach(o=>{ o.t+=dt*o.sp; if(o.t>1){ o.t=0; o.a=rnd(0,6.28); o.lat=rnd(-.6,.6); } const r=S.R*(1.02+o.t*.55), a=o.a+o.t*.6;
        o.s.position.set(Math.cos(a)*Math.cos(o.lat)*r, Math.sin(o.lat)*r, Math.sin(a)*Math.cos(o.lat)*r); o.s.scale.setScalar(S.R*o.size*(.35+o.t*.9)); o.s.material.opacity=.38*Math.sin(Math.PI*o.t); }); }
    if(p.body.userData.iri) p.body.userData.iri.sheen.setHSL((.92+Math.sin(t*.3)*.06)%1,.5,.82);
    if(p.body.userData.air){ p.body.userData.air.forEach((m,i)=>{ m.uniforms.uTime.value=t; m.uniforms.uPulse.value=airPulse(t); }); p.body.children[0].rotation.y-=dt*.03; } });
  belt.rotation.y+=dt*.02; asteroids.forEach(a=>{ const s=a.userData.spin; a.rotation.x+=s.x*dt; a.rotation.y+=s.y*dt; a.rotation.z+=s.z*dt; }); motifAnims.forEach(f=>f(t,dt));
  envMats.forEach(m=>m.uniforms.uTime.value=t); if(envDust) envDust.rotation.y+=dt*.004;
  nebulae.forEach(g=>g.children.forEach(c=>{ if(c.userData.billboard) c.quaternion.copy(camera.quaternion); }));
  updateFragments(dt);
  updateWaves(t); updateArtifacts(t,dt); updateUFO(t,dt);
  BLACKHOLE.diskMat.uniforms.uTime.value=t; BLACKHOLE.updateStars(dt); BLACKHOLE.g.quaternion.copy(camera.quaternion); // どこから見ても、渦の穴をのぞき込む角度で見える BLACKHOLE.photon.material.opacity=.45+Math.sin(t*.8)*.1;
  VISITOR.stars.forEach((s,i)=>s.material.opacity=.6+.3*Math.sin(t*1.3+i*1.7)); VISITOR.neb.children.forEach((s,i)=>{ if(s.isSprite) s.material.rotation+=dt*.01*(i%2?1:-1); });
  astroRings.forEach(r=>r.quaternion.copy(camera.quaternion));
  document.getElementById('closing').style.opacity = mode==='universe' ? .7 : 0;
  trendComets.forEach(c=>c.update(dt)); MINTCORE.update(t,dt); updateBeliefs(t,dt);
  for(let i=ambient.length-1;i>=0;i--){ if(!ambient[i].update(dt)){ ambient[i].dispose(); ambient.splice(i,1); } }
  nextAmbient-=dt; if(nextAmbient<=0 && ambient.length<3){ spawnAmbient(); nextAmbient=rnd(6,14); }
  archive.forEach((a,i)=>{ a.sprite.material.opacity=.25+Math.sin(t*.5+i)*.08; });
  if(selected){ halo.position.copy(wpos(selected)); halo.material.opacity=.28+Math.sin(t*2)*.08; }
  centerStar.material.rotation+=dt*.05;
  updateSpot(dt,t);
  renderer.render(scene,camera);
  labels.forEach(L=>{ L.obj.getWorldPosition(v3); const d=camera.position.distanceTo(v3); v3.project(camera);
    const on=v3.z<1&&labelVisible(L)&&Math.abs(v3.x)<1.1&&Math.abs(v3.y)<1.1;
    L.el.style.opacity=on?(L.show==='always'?Math.max(.25,Math.min(1,60/d)):1):0;
    if(on){ const off=L.show==='always'?0:-16; L.el.style.transform=`translate(-50%,-50%) translate(${(v3.x*.5+.5)*innerWidth}px,${(-v3.y*.5+.5)*innerHeight+off}px)`; } });
  updateOrbitThumbs(t);
  zoomDot.style.top=(1-(cam.radius-LIMIT.min)/(LIMIT_MAX_FN()-LIMIT.min))*82+'px';
  requestAnimationFrame(tick); }
addEventListener('resize',()=>{ renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); if(mode==='universe') goal.radius=homeRadius(); });
requestAnimationFrame(t=>{ document.getElementById('load').style.opacity=0; setTimeout(()=>document.getElementById('load').remove(),900); last=t; tick(t); });
setTimeout(hideHint,9000);
if(!SHOW_MUSIC) document.getElementById('closing').style.display='none'; // 一文は今は出さない

</script>
