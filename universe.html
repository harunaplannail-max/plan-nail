<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"

      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>NAIL ART UNIVERSE — Plan.nail</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Kosugi&display=swap" rel="stylesheet">

<style>

:root{

  --bg:#03050a;

  --white:#f5f3ee;

  --muted:rgba(255,255,255,.48);

  --pink:#ffb7df;

  --purple:#bda8ff;

  --blue:#9fd5ff;

  --glass:rgba(12,14,23,.58);

  --line:rgba(210,220,255,.16);

}

*{

  box-sizing:border-box;

  margin:0;

  padding:0;

  -webkit-tap-highlight-color:transparent;

}

html,

body{

  width:100%;

  height:100%;

  overflow:hidden;

  background:#03050a;

  color:white;

  font-family:'Kosugi',sans-serif;

}

body{

  touch-action:none;

}

/* =====================================================

   APP

===================================================== */

#app{

  position:fixed;

  inset:0;

  overflow:hidden;

  background:

    radial-gradient(

      ellipse at 50% 45%,

      rgba(110,70,190,.13),

      transparent 42%

    ),

    radial-gradient(

      ellipse at 20% 80%,

      rgba(80,120,255,.08),

      transparent 35%

    ),

    #03050a;

}

/* subtle film */

#app::after{

  content:"";

  position:absolute;

  inset:0;

  pointer-events:none;

  z-index:100;

  opacity:.035;

  background-image:

    repeating-radial-gradient(

      circle at 0 0,

      #fff 0,

      #fff 1px,

      transparent 1px,

      transparent 3px

    );

  background-size:4px 4px;

  mix-blend-mode:screen;

}

/* =====================================================

   SPACE

===================================================== */

#space{

  position:absolute;

  inset:0;

  overflow:hidden;

}

.parallax{

  position:absolute;

  width:5000px;

  height:5000px;

  left:50%;

  top:50%;

  transform-origin:center;

  pointer-events:none;

  will-change:transform;

}

#pFar{

  z-index:0;

}

#pMid{

  z-index:1;

}

#world{

  position:absolute;

  width:5000px;

  height:5000px;

  left:50%;

  top:50%;

  z-index:2;

  transform-origin:center;

  will-change:transform;

}

/* =====================================================

   SPACE BACKGROUND

===================================================== */

#deepSpace{

  position:absolute;

  inset:0;

  background:

    radial-gradient(

      ellipse at 50% 50%,

      rgba(255,255,255,.025),

      transparent 35%

    ),

    radial-gradient(

      ellipse at 20% 20%,

      rgba(90,120,255,.08),

      transparent 30%

    ),

    radial-gradient(

      ellipse at 80% 75%,

      rgba(210,70,190,.07),

      transparent 35%

    );

}

/* =====================================================

   STARS

===================================================== */

.star{

  position:absolute;

  width:2px;

  height:2px;

  border-radius:50%;

  background:#fff;

  box-shadow:

    0 0 4px rgba(255,255,255,.8),

    0 0 12px rgba(180,210,255,.45);

  animation:

    twinkle

    4s

    ease-in-out

    infinite;

}

@keyframes twinkle{

  0%,100%{

    opacity:.15;

    transform:scale(.8);

  }

  50%{

    opacity:.9;

    transform:scale(1.35);

  }

}

/* =====================================================

   NEBULA

===================================================== */

.nebula{

  position:absolute;

  border-radius:50%;

  pointer-events:none;

  filter:blur(45px);

  mix-blend-mode:screen;

}

.nebula.purple{

  background:

    radial-gradient(

      circle,

      rgba(190,90,255,.45),

      rgba(100,30,180,.20) 38%,

      transparent 72%

    );

}

.nebula.blue{

  background:

    radial-gradient(

      circle,

      rgba(70,160,255,.4),

      rgba(30,70,180,.16) 40%,

      transparent 72%

    );

}

.nebula.pink{

  background:

    radial-gradient(

      circle,

      rgba(255,100,200,.4),

      rgba(180,30,120,.14) 42%,

      transparent 74%

    );

}

.nebula.gold{

  background:

    radial-gradient(

      circle,

      rgba(255,210,130,.28),

      rgba(180,100,40,.1) 42%,

      transparent 72%

    );

}

/* =====================================================

   MILKY WAY

===================================================== */

.milkyway{

  position:absolute;

  width:4700px;

  height:850px;

  left:150px;

  top:2050px;

  transform:rotate(-18deg);

  background:

    radial-gradient(

      ellipse at center,

      rgba(255,255,255,.18),

      rgba(180,150,255,.08) 25%,

      transparent 68%

    );

  filter:blur(55px);

  opacity:.55;

}

/* =====================================================

   GALAXIES

===================================================== */

.galaxy{

  position:absolute;

  width:650px;

  height:300px;

  border-radius:50%;

  transform:rotate(-22deg);

  background:

    radial-gradient(

      ellipse at center,

      rgba(255,255,255,.8),

      rgba(255,210,150,.45) 4%,

      rgba(210,120,255,.25) 15%,

      rgba(100,100,255,.1) 35%,

      transparent 70%

    );

  filter:blur(2px);

  opacity:.55;

}

.galaxy::after{

  content:"";

  position:absolute;

  inset:20% 0;

  border-radius:50%;

  border-top:

    3px solid

    rgba(255,255,255,.12);

  border-bottom:

    3px solid

    rgba(180,150,255,.08);

  filter:blur(5px);

}

/* =====================================================

   CONSTELLATIONS

===================================================== */

#connections{

  position:absolute;

  inset:0;

  width:100%;

  height:100%;

  pointer-events:none;

}

.constellation-line{

  stroke:

    rgba(190,210,255,.2);

  stroke-width:2;

  fill:none;

  filter:

    drop-shadow(

      0 0 8px

      rgba(160,190,255,.35)

    );

  stroke-dasharray:8 10;

  animation:

    constellationMove

    8s

    linear

    infinite;

}

@keyframes constellationMove{

  to{

    stroke-dashoffset:-100;

  }

}

.constellation-line.sub{

  stroke:

    rgba(255,180,225,.25);

  stroke-width:1.5;

  stroke-dasharray:5 8;

}

/* =====================================================

   ORBIT

===================================================== */

.orbit{

  position:absolute;

  border-radius:50%;

  border:

    1px solid

    rgba(210,190,255,.08);

  pointer-events:none;

  animation:

    orbitRotate

    35s

    linear

    infinite;

}

.orbit::after{

  content:"";

  position:absolute;

  width:5px;

  height:5px;

  left:50%;

  top:-3px;

  border-radius:50%;

  background:white;

  box-shadow:

    0 0 15px white,

    0 0 35px rgba(200,170,255,.8);

}

@keyframes orbitRotate{

  from{

    transform:rotate(0deg);

  }

  to{

    transform:rotate(360deg);

  }

}

/* =====================================================

   GENRE NODE

===================================================== */

.node{

  position:absolute;

  width:90px;

  height:90px;

  transform:

    translate(-50%,-50%);

  cursor:pointer;

  transition:

    transform .3s cubic-bezier(.2,.8,.2,1);

  z-index:5;

}

.node:hover{

  transform:

    translate(-50%,-50%)

    scale(1.15);

}

.node-core{

  width:160px;

  height:160px;

}

/* halo */

.node .halo{

  position:absolute;

  inset:-45px;

  border-radius:50%;

  background:

    radial-gradient(

      circle,

      rgba(255,255,255,.24),

      rgba(190,140,255,.13) 25%,

      transparent 70%

    );

  filter:blur(16px);

  animation:

    breathe

    4s

    ease-in-out

    infinite;

}

@keyframes breathe{

  0%,100%{

    transform:scale(.9);

    opacity:.6;

  }

  50%{

    transform:scale(1.15);

    opacity:1;

  }

}

/* core */

.node .starCore{

  position:absolute;

  left:50%;

  top:50%;

  transform:

    translate(-50%,-50%);

  width:20px;

  height:20px;

  border-radius:50%;

  background:white;

  box-shadow:

    0 0 8px white,

    0 0 22px white,

    0 0 55px rgba(190,210,255,.9);

  animation:

    corePulse

    3s

    ease-in-out

    infinite;

}

.node-core .starCore{

  width:34px;

  height:34px;

  box-shadow:

    0 0 12px white,

    0 0 35px white,

    0 0 90px rgba(210,180,255,1);

}

@keyframes corePulse{

  0%,100%{

    transform:

      translate(-50%,-50%)

      scale(.85);

  }

  50%{

    transform:

      translate(-50%,-50%)

      scale(1.2);

  }

}

/* label */

.node .label{

  position:absolute;

  top:calc(100% + 14px);

  left:50%;

  transform:

    translateX(-50%);

  text-align:center;

  white-space:nowrap;

  text-shadow:

    0 3px 15px #000;

}

.label .en{

  font-family:

    'Special Elite',

    serif;

  font-size:17px;

  letter-spacing:.1em;

}

.node-core .label .en{

  font-size:22px;

}

.label .jp{

  margin-top:4px;

  font-size:10px;

  color:

    rgba(255,255,255,.45);

}

/* =====================================================

   ART NODE

===================================================== */

.art-node{

  position:absolute;

  width:100px;

  height:125px;

  transform:

    translate(-50%,-50%);

  cursor:pointer;

  z-index:10;

}

.art-node .thumb{

  width:68px;

  height:88px;

  margin:auto;

  display:block;

  object-fit:cover;

  border-radius:18px;

  background:

    linear-gradient(

      145deg,

      #252734,

      #11131c

    );

  background-size:cover;

  background-position:center;

  border:

    1px solid

    rgba(255,255,255,.3);

  box-shadow:

    0 0 0 1px rgba(255,255,255,.04),

    0 10px 35px rgba(0,0,0,.55),

    0 0 30px rgba(200,170,255,.2);

  transition:

    transform .3s ease,

    box-shadow .3s ease;

}

.art-node:hover .thumb{

  transform:

    translateY(-5px)

    scale(1.06);

  box-shadow:

    0 15px 40px rgba(0,0,0,.65),

    0 0 45px rgba(255,170,220,.35);

}

.art-node::before{

  content:"";

  position:absolute;

  width:130px;

  height:130px;

  left:50%;

  top:40px;

  transform:

    translate(-50%,-50%);

  border-radius:50%;

  background:

    radial-gradient(

      circle,

      rgba(255,170,220,.18),

      transparent 68%

    );

  filter:blur(15px);

  z-index:-1;

}

.art-node .aname{

  margin-top:7px;

  text-align:center;

  font-size:9px;

  color:

    rgba(255,255,255,.58);

  white-space:nowrap;

}

/* =====================================================

   HUD

===================================================== */

#hud{

  position:fixed;

  left:0;

  right:0;

  top:0;

  z-index:20;

  padding:

    calc(18px + env(safe-area-inset-top))

    22px

    20px;

  pointer-events:none;

  background:

    linear-gradient(

      rgba(0,0,0,.58),

      transparent

    );

}

.logo{

  font-family:

    'Special Elite',

    serif;

  font-size:14px;

  letter-spacing:.2em;

}

.subtitle{

  font-size:8px;

  color:

    rgba(255,255,255,.38);

  margin-top:5px;

  letter-spacing:.08em;

}

.zoomLevel{

  position:absolute;

  right:22px;

  top:calc(22px + env(safe-area-inset-top));

  font-family:

    'Special Elite',

    serif;

  font-size:9px;

  color:

    rgba(255,255,255,.35);

  letter-spacing:.08em;

}

/* =====================================================

   CONTROLS

===================================================== */

#controls{

  position:fixed;

  right:18px;

  bottom:

    calc(

      25px +

      env(safe-area-inset-bottom)

    );

  z-index:30;

  display:flex;

  flex-direction:column;

  gap:9px;

}

.control{

  width:44px;

  height:44px;

  border-radius:50%;

  border:

    1px solid

    rgba(255,255,255,.18);

  background:

    rgba(10,10,17,.62);

  backdrop-filter:

    blur(18px);

  -webkit-backdrop-filter:

    blur(18px);

  color:white;

  font-size:20px;

  display:flex;

  align-items:center;

  justify-content:center;

  box-shadow:

    0 10px 30px rgba(0,0,0,.35);

  cursor:pointer;

}

/* =====================================================

   SHEET

===================================================== */

#sheet{

  position:fixed;

  left:14px;

  right:14px;

  bottom:

    calc(

      14px +

      env(safe-area-inset-bottom)

    );

  z-index:50;

  padding:20px;

  border-radius:24px;

  background:

    linear-gradient(

      135deg,

      rgba(25,25,35,.94),

      rgba(7,8,14,.96)

    );

  border:

    1px solid

    rgba(255,255,255,.15);

  backdrop-filter:

    blur(30px);

  -webkit-backdrop-filter:

    blur(30px);

  box-shadow:

    0 25px 100px rgba(0,0,0,.7);

  transform:

    translateY(130%);

  transition:

    transform .45s

    cubic-bezier(.2,.8,.2,1);

}

#sheet.show{

  transform:

    translateY(0);

}

.sheetClose{

  position:absolute;

  right:17px;

  top:12px;

  font-size:22px;

  color:

    rgba(255,255,255,.5);

  cursor:pointer;

}

.sheetGrid{

  display:flex;

  gap:16px;

}

.sheetImage{

  width:90px;

  height:112px;

  flex:none;

  border-radius:18px;

  background:

    #20222b;

  background-size:cover;

  background-position:center;

  border:

    1px solid

    rgba(255,255,255,.15);

  box-shadow:

    0 10px 35px rgba(0,0,0,.4);

}

.sheetTitle{

  font-family:

    'Special Elite',

    serif;

  font-size:18px;

  padding-right:25px;

}

.sheetCategory{

  margin-top:5px;

  font-size:10px;

  color:

    #c3afff;

  letter-spacing:.08em;

}

.sheetDescription{

  margin-top:10px;

  font-size:11px;

  line-height:1.7;

  color:

    rgba(255,255,255,.62);

}

.tags{

  display:flex;

  gap:5px;

  margin-top:10px;

  flex-wrap:wrap;

}

.tag{

  border:

    1px solid

    rgba(255,255,255,.18);

  padding:

    4px 8px;

  border-radius:20px;

  font-size:8px;

  color:

    rgba(255,255,255,.6);

}

/* =====================================================

   HINT

===================================================== */

#travelHint{

  position:fixed;

  left:50%;

  bottom:

    calc(

      26px +

      env(safe-area-inset-bottom)

    );

  transform:

    translateX(-50%);

  z-index:10;

  font-size:8px;

  letter-spacing:.12em;

  white-space:nowrap;

  color:

    rgba(255,255,255,.3);

  pointer-events:none;

  animation:

    fadeHint

    6s

    forwards;

}

@keyframes fadeHint{

  0%{

    opacity:0;

  }

  20%{

    opacity:1;

  }

  70%{

    opacity:1;

  }

  100%{

    opacity:0;

  }

}

/* =====================================================

   MOBILE

===================================================== */

@media(max-width:600px){

  .node .label .en{

    font-size:14px;

  }

  .node-core .label .en{

    font-size:18px;

  }

  .node .label .jp{

    font-size:8px;

  }

  .art-node .thumb{

    width:60px;

    height:78px;

  }

  .sheetImage{

    width:82px;

    height:105px;

  }

}

</style>

/* =====================================================

   STAR FIELD

===================================================== */

function scatterLayer(

  container,

  count,

  minSize,

  maxSize,

  minOpacity,

  maxOpacity

){

  for(

    let i=0;

    i<count;

    i++

  ){

    const star =

      document.createElement('div');

    star.className='star';

    const size =

      minSize +

      Math.random() *

      (maxSize-minSize);

    star.style.width =

      size+'px';

    star.style.height =

      size+'px';

    star.style.left =

      Math.random()*5000+'px';

    star.style.top =

      Math.random()*5000+'px';

    star.style.opacity =

      (

        minOpacity +

        Math.random() *

        (maxOpacity-minOpacity)

      ).toFixed(2);

    star.style.animationDelay =

      Math.random()*5+'s';

    container.appendChild(star);

  }

}

const svg =

svg.setAttribute(

  'viewBox',

  '0 0 5000 5000'

);

function connect(

  a,

  b,

  cls=''

){

  const line =

    document.createElementNS(

      'http://www.w3.org/2000/svg',

      'line'

    );

  line.setAttribute(

    'x1',

    a.x

  );

  line.setAttribute(

    'y1',

    a.y

  );

  line.setAttribute(

    'x2',

    b.x

  );

  line.setAttribute(

    'y2',

    b.y

  );

  line.classList.add(

    'constellation-line'

  );

  if(cls)

    line.classList.add(cls);

  svg.appendChild(line);

}

/* =====================================================

   OPEN GENRE

===================================================== */

function openGenre(

  genre

){

  const targetScale =

    genre.core

      ? 1

      : 2.25;

  const rect =

    document

      .getElementById('space')

      .getBoundingClientRect();

  const cx =

    rect.width/2;

  const cy =

    rect.height/2;

  worldX =

    cx -

    genre.x *

    targetScale;

  worldY =

    cy -

    genre.y *

    targetScale;

  scale =

    targetScale;

  applyTransform();

  if(!genre.core){

    showArtNodes(

      genre

    );

  }

}

/* =====================================================

   ART NODES

===================================================== */

function showArtNodes(

  genre

){

  document

    .querySelectorAll(

      '.art-node'

    )

    .forEach(

      el=>el.remove()

    );

  document

    .querySelectorAll(

      '.constellation-line.sub'

    )

    .forEach(

      el=>el.remove()

    );

  const items =

    ART_BY_GENRE[

      genre.id

    ] || [];

  items.forEach(

    (art,index)=>{

      const angle =

        index *

        2.1 +

        .6;

      const ax =

        genre.x +

        Math.cos(angle) *

        220;

      const ay =

        genre.y +

        Math.sin(angle) *

        190;

      connect(

        genre,

        {

          x:ax,

          y:ay

        },

        'sub'

      );

      const node =

        document.createElement(

          'div'

        );

      node.className =

        'art-node';

      node.style.left =

        ax+'px';

      node.style.top =

        ay+'px';

      node.innerHTML = `

        <div

          class="thumb"

          style="

            background-image:

              url('${art.thumb}');

          ">

        </div>

        <div class="aname">

          ${art.name.split(' ')[0]}

        </div>

      `;

      node.onclick =

        event=>{

          event.stopPropagation();

          openArt(art);

        };

      nodes.appendChild(

        node

      );

    }

  );

}

/* =====================================================

   NAVIGATION

===================================================== */

const world =

  document.getElementById(

    'world'

  );

let scale=1;

let worldX=0;

let worldY=0;

let dragging=false;

let startX=0;

let startY=0;

let startWorldX=0;

let startWorldY=0;

let pinchStartDistance=0;

let pinchStartScale=1;

const DEPTH_FAR=.35;

const DEPTH_MID=.62;

function applyTransform(){

  world.style.transform =

    `

      translate3d(

        ${worldX}px,

        ${worldY}px,

        0

      )

      scale(${scale})

    `;

  pFar.style.transform =

    `

      translate3d(

        ${worldX*DEPTH_FAR}px,

        ${worldY*DEPTH_FAR}px,

        0

      )

      scale(${.7+.3*scale})

    `;

  pMid.style.transform =

    `

      translate3d(

        ${worldX*DEPTH_MID}px,

        ${worldY*DEPTH_MID}px,

        0

      )

      scale(${.8+.2*scale})

    `;

  updateZoomLabel();

}

function updateZoomLabel(){

  const label =

    document.getElementById(

      'zoomText'

    );

  if(scale<.75){

    label.textContent =

      'DEEP SPACE';

  }else if(scale<1.4){

    label.textContent =

      'GALAXY VIEW';

  }else if(scale<2.4){

    label.textContent =

      'GENRE REGION';

  }else{

    label.textContent =

      'ART CONSTELLATION';

  }

}

/* =====================================================

   DESKTOP DRAG

===================================================== */

document

  .getElementById('space')

  .addEventListener(

    'pointerdown',

    event=>{

      if(

        event.pointerType ===

        'touch'

      )

        return;

      dragging=true;

      startX =

        event.clientX;

      startY =

        event.clientY;

      startWorldX =

        worldX;

      startWorldY =

        worldY;

    }

  );

window.addEventListener(

  'pointermove',

  event=>{

    if(!dragging)

      return;

    worldX =

      startWorldX +

      event.clientX -

      startX;

    worldY =

      startWorldY +

      event.clientY -

      startY;

    applyTransform();

  }

);

window.addEventListener(

  'pointerup',

  ()=>{

    dragging=false;

  }

);

/* =====================================================

   TOUCH

===================================================== */

const space =

  document.getElementById(

    'space'

  );

let touches=[];

space.addEventListener(

  'touchstart',

  event=>{

    touches=[

      ...event.touches

    ];

    if(

      touches.length===2

    ){

      pinchStartDistance =

        distance(

          touches[0],

          touches[1]

        );

      pinchStartScale =

        scale;

    }else if(

      touches.length===1

    ){

      startX =

        touches[0].clientX;

      startY =

        touches[0].clientY;

      startWorldX =

        worldX;

      startWorldY =

        worldY;

    }

  },

  {

    passive:false

  }

);

space.addEventListener(

  'touchmove',

  event=>{

    event.preventDefault();

    touches=[

      ...event.touches

    ];

    if(

      touches.length===2

    ){

      const d =

        distance(

          touches[0],

          touches[1]

        );

      const ratio =

        d /

        pinchStartDistance;

      scale =

        clamp(

          pinchStartScale *

          ratio,

          .45,

          4

        );

      applyTransform();

    }else if(

      touches.length===1

    ){

      worldX =

        startWorldX +

        touches[0].clientX -

        startX;

      worldY =

        startWorldY +

        touches[0].clientY -

        startY;

      applyTransform();

    }

  },

  {

    passive:false

  }

);

function distance(a,b){

  return Math.hypot(

    a.clientX-b.clientX,

    a.clientY-b.clientY

  );

}

function clamp(

  value,

  min,

  max

){

  return Math.max(

    min,

    Math.min(max,value)

  );

}

/* =====================================================

   ZOOM

===================================================== */

function zoomIn(){

  scale =

    clamp(

      scale*1.35,

      .45,

      4

    );

  applyTransform();

}

function zoomOut(){

  scale =

    clamp(

      scale/1.35,

      .45,

      4

    );

  applyTransform();

}

  scale=1;

  const rect =

    space.getBoundingClientRect();

    rect.height/2 -

  document

      el=>el.remove()

    );

  document

    .querySelectorAll(

      '.constellation-line.sub'

    )

    .forEach(

      el=>el.remove()

    );

  applyTransform();

}
