<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NAIL ART UNIVERSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://lh3.googleusercontent.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Kosugi&display=swap" rel="stylesheet">
<style>
:root{ --bg:#02030a; --white:#f7f5ef; --muted:rgba(255,255,255,.45); }
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ width:100%; height:100%; overflow:hidden; background:#02030a; color:white; font-family:'Kosugi',sans-serif; }
body{ touch-action:none; }

#app{ position:fixed; inset:0; overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 45%, rgba(100,70,180,.13), transparent 42%),
    radial-gradient(ellipse at 20% 80%, rgba(30,90,180,.08), transparent 40%),
    #02030a; }

#space{ position:absolute; inset:0; overflow:hidden; perspective:1000px; }

.parallax{ position:absolute; width:6000px; height:6000px; left:50%; top:50%;
  transform-origin:center; pointer-events:none; will-change:transform; }
#pFar{ z-index:0; } #pMid{ z-index:1; } #pNear{ z-index:2; }

#world{ position:absolute; width:6000px; height:6000px; left:50%; top:50%; z-index:5;
  transform-origin:center center; will-change:transform; }

#deepSpace{ position:absolute; inset:0;
  background:
    radial-gradient(ellipse at 50% 50%, rgba(255,255,255,.035), transparent 30%),
    radial-gradient(ellipse at 20% 30%, rgba(40,110,255,.07), transparent 35%),
    radial-gradient(ellipse at 75% 70%, rgba(190,70,220,.055), transparent 35%),
    radial-gradient(ellipse at 60% 15%, rgba(255,110,170,.035), transparent 30%); }

.star{ position:absolute; border-radius:50%; background:#fff;
  box-shadow:0 0 3px rgba(255,255,255,.9), 0 0 8px rgba(190,210,255,.45);
  animation:starTwinkle var(--duration) ease-in-out infinite; }
@keyframes starTwinkle{
  0%,100%{ opacity:.15; transform:scale(.75); }
  50%{ opacity:var(--maxOpacity); transform:scale(1.25); } }

.bigStar{ position:absolute; width:5px; height:5px; border-radius:50%; background:#fff;
  box-shadow:0 0 4px #fff, 0 0 12px #fff, 0 0 28px rgba(150,190,255,.8), 0 0 50px rgba(130,100,255,.3); }
.bigStar::before,.bigStar::after{ content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  background:linear-gradient(transparent, rgba(255,255,255,.8), transparent); }
.bigStar::before{ width:1px; height:70px; }
.bigStar::after{ width:70px; height:1px; }

.milkyway{ position:absolute; width:6200px; height:1250px; left:-300px; top:2300px;
  transform:rotate(-18deg) translateZ(-100px); border-radius:50%;
  background:radial-gradient(ellipse at center, rgba(255,255,255,.18), rgba(190,175,255,.08) 20%, rgba(120,140,255,.035) 42%, transparent 72%);
  filter:blur(45px); opacity:.65; }
.milkywayStars{ position:absolute; width:6200px; height:1100px; left:-300px; top:2300px;
  transform:rotate(-18deg); opacity:.55; }

.nebula{ position:absolute; pointer-events:none; border-radius:50%; mix-blend-mode:screen; filter:blur(45px); opacity:.7; }
.nebula::before{ content:""; position:absolute; inset:-20%; border-radius:50%;
  background:
    radial-gradient(ellipse at 35% 40%, rgba(255,255,255,.13), transparent 20%),
    radial-gradient(ellipse at 65% 60%, rgba(255,255,255,.08), transparent 25%);
  filter:blur(35px); }
.nebula.purple{ background:radial-gradient(ellipse at 40% 45%, rgba(190,100,255,.55), rgba(110,50,210,.25) 28%, rgba(70,30,150,.12) 50%, transparent 75%); }
.nebula.blue{ background:radial-gradient(ellipse at 55% 45%, rgba(70,170,255,.5), rgba(30,90,210,.24) 30%, rgba(30,50,160,.1) 52%, transparent 75%); }
.nebula.pink{ background:radial-gradient(ellipse at 40% 55%, rgba(255,100,190,.45), rgba(200,50,150,.2) 30%, rgba(150,30,120,.08) 52%, transparent 75%); }
.nebula.gold{ background:radial-gradient(ellipse at 55% 45%, rgba(255,210,130,.4), rgba(200,120,60,.17) 30%, transparent 72%); }

.cloud{ position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; filter:blur(18px); opacity:.3; }
.cloud::before{ content:""; position:absolute; width:100%; height:100%; border-radius:50%;
  background:repeating-radial-gradient(ellipse, rgba(255,255,255,.08) 0px, rgba(255,255,255,.08) 3px, transparent 7px, transparent 18px); }

.galaxy{ position:absolute; width:720px; height:340px; border-radius:50%; transform:rotate(-20deg);
  background:radial-gradient(ellipse at center, rgba(255,255,255,.95) 0%, rgba(255,215,170,.55) 3%, rgba(220,140,255,.25) 14%, rgba(100,120,255,.12) 32%, transparent 70%);
  filter:blur(2px); opacity:.65; }
.galaxy::before{ content:""; position:absolute; inset:18% 0; border-radius:50%;
  border-top:3px solid rgba(255,255,255,.18); border-bottom:2px solid rgba(180,160,255,.12); filter:blur(5px); }
.galaxy::after{ content:""; position:absolute; inset:35% 10%; border-radius:50%;
  background:radial-gradient(ellipse, rgba(255,255,255,.4), transparent 70%); filter:blur(8px); }

svg{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.constellation-line{ stroke:rgba(185,210,255,.27); stroke-width:2; fill:none;
  filter:drop-shadow(0 0 7px rgba(120,180,255,.35)); }
.constellation-line.sub{ stroke:rgba(255,190,225,.34); stroke-width:1.5; }

.node{ position:absolute; width:100px; height:100px; transform:translate(-50%,-50%); cursor:pointer; transition:transform .25s ease; }
.node:hover{ transform:translate(-50%,-50%) scale(1.12); }
.node-core{ width:170px; height:170px; }
.node .halo{ position:absolute; inset:-45px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.18), rgba(170,120,255,.1) 25%, transparent 70%);
  filter:blur(14px); animation:pulse 4s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{ transform:scale(.8); opacity:.45; } 50%{ transform:scale(1.2); opacity:.9; } }
.node .starCore{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:20px; height:20px;
  border-radius:50%; background:#fff;
  box-shadow:0 0 5px #fff, 0 0 15px #fff, 0 0 30px rgba(170,200,255,.9), 0 0 60px rgba(150,100,255,.55); }
.node-core .starCore{ width:36px; height:36px; }
.node .label{ position:absolute; top:calc(100% + 16px); left:50%; transform:translateX(-50%);
  text-align:center; white-space:nowrap; text-shadow:0 2px 10px #000, 0 0 18px #000; }
.label .en{ font-family:'Special Elite',serif; font-size:18px; letter-spacing:.1em; }
.label .jp{ margin-top:4px; font-size:10px; color:rgba(255,255,255,.45); }

.art-node{ position:absolute; width:110px; height:140px; transform:translate(-50%,-50%); cursor:pointer; }
.art-node .thumb{ width:72px; height:92px; margin:auto; border-radius:18px; background-color:#171925;
  overflow:hidden; border:1px solid rgba(255,255,255,.28);
  box-shadow:0 0 20px rgba(190,150,255,.3), 0 0 60px rgba(140,120,255,.08);
  transition:transform .3s ease, box-shadow .3s ease; }
.art-node .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
/* 画像の読み込みに失敗した場合、透明な壊れたアイコンではなく淡いグロー円だけを残す */
.art-node .thumb.broken img{ opacity:0; }
.art-node .thumb.broken{ background:radial-gradient(circle, rgba(200,180,255,.25), #171925 72%); }
.art-node:hover .thumb{ transform:translateY(-8px) scale(1.08); box-shadow:0 0 30px rgba(255,190,230,.4); }
.art-node::before{ content:""; position:absolute; width:130px; height:130px; left:50%; top:50%;
  transform:translate(-50%,-50%); border-radius:50%;
  background:radial-gradient(circle, rgba(255,180,220,.16), transparent 65%); filter:blur(15px); }
.art-node .aname{ margin-top:8px; text-align:center; font-family:'Special Elite',serif; font-size:10px; color:rgba(255,255,255,.65); }

/* ジャンルの星の周りに常時浮かんでいる、代表3枚のプレビュー */
.preview-thumb{ position:absolute; width:30px; height:30px; transform:translate(-50%,-50%); z-index:6;
  border-radius:50%; overflow:hidden; cursor:pointer; background:#171925;
  border:1px solid rgba(255,255,255,.42);
  box-shadow:0 0 8px rgba(190,160,255,.4), 0 0 18px rgba(140,120,255,.15);
  animation:previewFloat 3.6s ease-in-out infinite; }
.preview-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.preview-thumb.broken{ background:radial-gradient(circle, rgba(200,180,255,.3), #171925 70%); }
.preview-thumb.broken img{ opacity:0; }
@keyframes previewFloat{
  0%,100%{ transform:translate(-50%,-50%) translateY(0); }
  50%{ transform:translate(-50%,-50%) translateY(-5px); } }

#hud{ position:fixed; left:0; right:0; top:0; z-index:30;
  padding:calc(20px + env(safe-area-inset-top)) 22px 20px; pointer-events:none;
  background:linear-gradient(rgba(0,0,0,.7), rgba(0,0,0,.18), transparent); }
.logo{ font-family:'Special Elite',serif; font-size:15px; letter-spacing:.2em; }
.subtitle{ margin-top:5px; font-size:9px; color:rgba(255,255,255,.45); }
.zoomLevel{ position:absolute; right:22px; top:25px; font-family:'Special Elite',serif;
  font-size:10px; letter-spacing:.1em; color:rgba(255,255,255,.45); }

#backLink{ position:fixed; left:18px; bottom:calc(25px + env(safe-area-inset-bottom)); z-index:40;
  font-family:'Special Elite',serif; font-size:10px; letter-spacing:.12em; text-decoration:none;
  color:rgba(255,255,255,.7); padding:10px 16px; border-radius:999px;
  border:1px solid rgba(255,255,255,.18); background:rgba(8,10,18,.62); backdrop-filter:blur(18px); }

#controls{ position:fixed; right:18px; bottom:calc(25px + env(safe-area-inset-bottom)); z-index:40;
  display:flex; flex-direction:column; gap:8px; }
.control{ width:44px; height:44px; border-radius:50%; border:1px solid rgba(255,255,255,.18);
  background:rgba(8,10,18,.62); backdrop-filter:blur(18px); color:white; font-size:20px;
  display:flex; align-items:center; justify-content:center; }

#sheet{ position:fixed; left:18px; right:18px; bottom:calc(18px + env(safe-area-inset-bottom)); z-index:80;
  padding:20px; border-radius:24px;
  background:linear-gradient(135deg, rgba(22,22,32,.96), rgba(5,6,12,.96));
  border:1px solid rgba(255,255,255,.16); backdrop-filter:blur(28px);
  box-shadow:0 25px 90px rgba(0,0,0,.75);
  transform:translateY(130%); transition:transform .45s cubic-bezier(.2,.8,.2,1); }
#sheet.show{ transform:translateY(0); }
.sheetClose{ position:absolute; right:16px; top:13px; font-size:20px; color:rgba(255,255,255,.5); }
.sheetGrid{ display:flex; gap:16px; }
.sheetImage{ width:90px; height:110px; flex-shrink:0; border-radius:18px; background:#171925; overflow:hidden; }
.sheetImage img{ width:100%; height:100%; object-fit:cover; display:block; }
.sheetTitle{ font-family:'Special Elite',serif; font-size:20px; }
.sheetCategory{ margin-top:5px; font-size:11px; color:#bca8ff; }
.sheetDescription{ margin-top:12px; font-size:12px; line-height:1.8; color:rgba(255,255,255,.65); }
.tags{ display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; }
.tag{ padding:5px 9px; border-radius:20px; border:1px solid rgba(255,255,255,.2); font-size:9px; }

#travelHint{ position:fixed; left:50%; bottom:calc(78px + env(safe-area-inset-bottom)); transform:translateX(-50%);
  z-index:20; font-size:9px; letter-spacing:.1em; color:rgba(255,255,255,.3); pointer-events:none;
  animation:fadeHint 7s forwards; }
@keyframes fadeHint{ 0%{opacity:0} 20%{opacity:1} 70%{opacity:1} 100%{opacity:0} }

#loading{ position:fixed; inset:0; z-index:90; display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:14px; background:#02030a; transition:opacity .6s; }
#loading.hide{ opacity:0; pointer-events:none; }
#loading .lg{ font-family:'Special Elite',serif; font-size:13px; letter-spacing:.24em; color:rgba(255,255,255,.75); }
#loading .ls{ font-size:9px; letter-spacing:.1em; color:rgba(255,255,255,.35); }
</style>
</head>

<body>

<div id="app">
  <div id="space">
    <div class="parallax" id="pFar"></div>
    <div class="parallax" id="pMid"></div>
    <div class="parallax" id="pNear"></div>

    <div id="world">
      <div id="deepSpace"></div>
      <div class="milkyway"></div>
      <div class="milkywayStars" id="milkywayStars"></div>

      <div class="nebula purple" style="width:1600px;height:1100px;left:300px;top:500px;"></div>
      <div class="nebula blue"   style="width:1500px;height:1000px;left:3000px;top:300px;"></div>
      <div class="nebula pink"   style="width:1700px;height:1200px;left:1300px;top:2800px;"></div>
      <div class="nebula gold"   style="width:1200px;height:900px;left:3700px;top:3100px;"></div>

      <div class="cloud" style="width:1000px;height:650px;left:900px;top:900px;background:rgba(100,130,255,.2);transform:rotate(-20deg);"></div>
      <div class="cloud" style="width:1400px;height:800px;left:2600px;top:1300px;background:rgba(210,100,255,.17);transform:rotate(15deg);"></div>

      <div class="galaxy" style="left:1800px;top:1900px;"></div>
      <div class="galaxy" style="left:4200px;top:1000px;transform:rotate(25deg) scale(.65);"></div>

      <div id="stars"></div>
      <svg id="connections"></svg>
      <div id="nodes"></div>
    </div>
  </div>
</div>

<div id="hud">
  <div class="logo">NAIL ART UNIVERSE</div>
  <div class="subtitle" id="subtitle">ARTISTIC GENRE MAP</div>
  <div class="zoomLevel"><span id="zoomText">GALAXY VIEW</span></div>
</div>

<div id="travelHint">PINCH TO EXPLORE · DRAG TO TRAVEL · TAP A STAR</div>

<a id="backLink" href="./index.html">← BACK</a>

<div id="controls">
  <button class="control" onclick="zoomIn()">+</button>
  <button class="control" onclick="zoomOut()">−</button>
  <button class="control" onclick="resetView()">◉</button>
</div>

<div id="sheet">
  <div class="sheetClose" onclick="closeSheet()">×</div>
  <div class="sheetGrid">
    <div id="sheetImage" class="sheetImage"></div>
    <div>
      <div id="sheetTitle" class="sheetTitle"></div>
      <div id="sheetCategory" class="sheetCategory"></div>
      <div id="sheetDescription" class="sheetDescription"></div>
      <div id="sheetTags" class="tags"></div>
    </div>
  </div>
</div>

<div id="loading">
  <div class="lg">NAIL ART UNIVERSE</div>
  <div class="ls" id="loadingText">CONNECTING…</div>
</div>

<script>
const API = '/api/notion';
const WORLD = 6000;
const CENTER = WORLD / 2;

/* =========================================================
   背景の星(3層+world層)
   ========================================================= */
function createStars(container, count, min, max, minOpacity, maxOpacity){
  const frag = document.createDocumentFragment();
  for (let i = 0; i < count; i++){
    const star = document.createElement('div');
    star.className = 'star';
    const size = min + Math.random()*(max-min);
    star.style.width = size+'px'; star.style.height = size+'px';
    star.style.left = Math.random()*WORLD+'px';
    star.style.top = Math.random()*WORLD+'px';
    star.style.setProperty('--duration', (2+Math.random()*5)+'s');
    star.style.setProperty('--maxOpacity', (minOpacity + Math.random()*(maxOpacity-minOpacity)).toFixed(2));
    star.style.animationDelay = Math.random()*5+'s';
    frag.appendChild(star);
  }
  container.appendChild(frag);
}
const pFar = document.getElementById('pFar');
const pMid = document.getElementById('pMid');
const pNear = document.getElementById('pNear');
createStars(pFar, 500, .3, .9, .05, .22);
createStars(pMid, 350, .5, 1.4, .08, .35);
createStars(pNear, 180, 1, 2.5, .15, .6);

const stars = document.getElementById('stars');
createStars(stars, 1000, .4, 3, .1, .9);

for (let i = 0; i < 35; i++){
  const s = document.createElement('div');
  s.className = 'bigStar';
  s.style.left = Math.random()*WORLD+'px';
  s.style.top = Math.random()*WORLD+'px';
  s.style.opacity = .25 + Math.random()*.75;
  stars.appendChild(s);
}

/* 天の川の粒子 */
const milkywayStars = document.getElementById('milkywayStars');
{
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 900; i++){
    const s = document.createElement('div');
    s.className = 'star';
    const x = Math.random()*6200;
    const y = 550 + (Math.random()-.5) * (Math.random()*Math.random()*900);
    const size = .3 + Math.random()*1.5;
    s.style.width = size+'px'; s.style.height = size+'px';
    s.style.left = x+'px'; s.style.top = y+'px';
    s.style.setProperty('--duration', (2+Math.random()*5)+'s');
    s.style.setProperty('--maxOpacity', (.05 + Math.random()*.65).toFixed(2));
    s.style.animationDelay = Math.random()*4+'s';
    frag.appendChild(s);
  }
  milkywayStars.appendChild(frag);
}

/* =========================================================
   星座の描画
   ========================================================= */
const svg = document.getElementById('connections');
svg.setAttribute('viewBox', `0 0 ${WORLD} ${WORLD}`);
const nodes = document.getElementById('nodes');

function connect(a, b, cls){
  const line = document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
  line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
  line.classList.add('constellation-line');
  if (cls) line.classList.add(cls);
  svg.appendChild(line);
}

/* =========================================================
   Notionの実データからジャンルを組み立てる
   ========================================================= */
let GENRES = [];
let ART_BY_GENRE = {};

function pickThumb(m){
  return m.thumbSmall || m.thumb || '';
}

async function loadUniverse(){
  let materials = [];
  try {
    const res = await fetch(`${API}?type=materials`);
    materials = await res.json();
    if (!Array.isArray(materials)) materials = [];
  } catch (e) {
    document.getElementById('loadingText').textContent = 'データを読み込めませんでした';
    console.error(e);
    return;
  }

  // moodタグごとに商材をまとめる(mood未設定のものは除く)
  const byMood = {};
  materials.forEach(m => {
    if (!m) return;
    const moods = (m.mood || '').split(',').map(s => s.trim()).filter(Boolean);
    moods.forEach(mood => {
      const key = mood.toUpperCase();
      (byMood[key] = byMood[key] || []).push(m);
    });
  });

  // 件数の多い順に最大8ジャンルを採用する(多すぎると画面が埋まるため)
  const moodKeys = Object.keys(byMood)
    .sort((a,b) => byMood[b].length - byMood[a].length)
    .slice(0, 8);

  if (!moodKeys.length){
    document.getElementById('loadingText').textContent = 'moodタグが見つかりませんでした';
    return;
  }

  // 中心 = 最も件数の多いジャンル、それ以外を円周上に配置する
  const coreKey = moodKeys[0];
  const others = moodKeys.slice(1);
  GENRES = [{ id: coreKey, name: coreKey, jp: `${byMood[coreKey].length} items`, x: CENTER, y: CENTER, core: true }];
  others.forEach((key, i) => {
    const angle = (i / others.length) * Math.PI * 2 - Math.PI/2;
    const radius = 560 + (i % 3) * 110;
    // 完全な円周上に並べると車輪のように見えるため、位置に揺らぎを持たせる
    const jitter = 80;
    GENRES.push({
      id: key, name: key, jp: `${byMood[key].length} items`,
      x: CENTER + Math.cos(angle) * radius + (Math.random()-0.5)*jitter,
      y: CENTER + Math.sin(angle) * radius + (Math.random()-0.5)*jitter,
    });
  });

  ART_BY_GENRE = {};
  moodKeys.forEach(key => {
    ART_BY_GENRE[key] = byMood[key].slice(0, 8).map(m => ({
      name: m.name || '',
      maker: m.maker || '',
      desc: m.desc || m.description || '',
      tags: (m.mood || '').split(',').map(s => s.trim()).filter(Boolean),
      thumb: pickThumb(m),
    }));
  });

  buildGenreNodes();
  document.getElementById('subtitle').textContent = `ARTISTIC GENRE MAP / ${GENRES.length} GENRES`;
  document.getElementById('loading').classList.add('hide');
}

// 実際の星座のように、各星を「一番近い、既に置いた星」とだけ繋ぐ。
// 中心から放射状に伸ばすと車輪のように見えてしまうため、この方式にしている。
function chainConnect(points, cls){
  const placed = [points[0]];
  for (let i = 1; i < points.length; i++){
    const p = points[i];
    let nearest = placed[0], nd = Infinity;
    placed.forEach(q => {
      const d = Math.hypot(p.x-q.x, p.y-q.y);
      if (d < nd) { nd = d; nearest = q; }
    });
    connect(nearest, p, cls);
    placed.push(p);
  }
}

function buildGenreNodes(){
  chainConnect(GENRES);
  GENRES.forEach((genre, i) => {
    const el = document.createElement('div');
    el.className = 'node ' + (genre.core ? 'node-core' : '');
    el.style.left = genre.x+'px'; el.style.top = genre.y+'px';
    el.style.opacity = '0';
    el.innerHTML = `
      <div class="halo"></div>
      <div class="starCore"></div>
      <div class="label"><div class="en">${genre.name}</div><div class="jp">${genre.jp}</div></div>`;
    el.addEventListener('click', e => { e.stopPropagation(); openGenre(genre); });
    nodes.appendChild(el);
    // 星が時間差で現れる
    setTimeout(() => { el.style.transition = 'opacity .7s'; el.style.opacity = '1'; }, 160 + i * 110);
  });
  buildPreviewThumbs();
}

// 各ジャンルの星の周りに、代表3枚のサムネイルを常時浮かべておく。
// タップして中に入ると、これは消えて全件のART CONSTELLATIONに切り替わる。
function buildPreviewThumbs(){
  GENRES.forEach((genre, gi) => {
    const previews = (ART_BY_GENRE[genre.id] || []).slice(0, 3);
    const baseR = genre.core ? 92 : 60;
    previews.forEach((art, pi) => {
      const angle = (pi / previews.length) * Math.PI * 2 + gi * 0.9;
      const px = genre.x + Math.cos(angle) * baseR;
      const py = genre.y + Math.sin(angle) * baseR * 0.85;
      const pel = document.createElement('div');
      pel.className = 'preview-thumb';
      pel.style.left = px+'px'; pel.style.top = py+'px';
      pel.style.opacity = '0';
      pel.style.animationDelay = (pi*0.5)+'s';
      pel.innerHTML = `<img src="${art.thumb}" alt="" loading="lazy"
        onerror="this.parentElement.classList.add('broken')">`;
      pel.onclick = e => { e.stopPropagation(); openArt(art); };
      nodes.appendChild(pel);
      setTimeout(() => { pel.style.transition = 'opacity .6s'; pel.style.opacity = '1'; },
        300 + gi * 110 + pi * 90);
    });
  });
}

/* =========================================================
   ジャンルを開く → ART CONSTELLATION
   ========================================================= */
function openGenre(genre){
  const targetScale = genre.core ? 1 : 2.4;
  const rect = document.getElementById('space').getBoundingClientRect();
  worldX = rect.width/2 - genre.x * targetScale;
  worldY = rect.height/2 - genre.y * targetScale;
  scale = targetScale;
  applyTransform();
  if (!genre.core) showArtNodes(genre);
}

function showArtNodes(genre){
  document.querySelectorAll('.art-node').forEach(e => e.remove());
  document.querySelectorAll('.constellation-line.sub').forEach(e => e.remove());
  document.querySelectorAll('.preview-thumb').forEach(e => e.remove());
  const items = ART_BY_GENRE[genre.id] || [];
  if (!items.length) return;

  const positions = [genre];
  items.forEach((art, index) => {
    const angle = index * 2.1 + .5 + (Math.random()-0.5)*0.5;
    // 星座として一目で分かるよう、距離を大幅に詰める
    const dist = 62 + index*15 + Math.random()*12;
    positions.push({
      x: genre.x + Math.cos(angle) * dist,
      y: genre.y + Math.sin(angle) * dist * 0.85,
      art,
    });
  });
  // 星座らしく、近い星同士だけを繋ぐ(常に中心=ジャンル本体、とは限らない)
  chainConnect(positions, 'sub');

  positions.slice(1).forEach((p, index) => {
    const art = p.art;
    const node = document.createElement('div');
    node.className = 'art-node';
    node.style.left = p.x+'px'; node.style.top = p.y+'px';
    node.style.opacity = '0';
    // background-imageではなくimgタグを使う(読み込み失敗時にonerrorで気づけるようにするため)
    node.innerHTML = `
      <div class="thumb"><img src="${art.thumb}" alt="" loading="lazy"
        onerror="this.closest('.thumb').classList.add('broken'); console.warn('画像読み込み失敗:', '${art.name}', '${art.thumb}');"></div>
      <div class="aname">${(art.name || '').split(' ')[0]}</div>`;
    node.onclick = e => { e.stopPropagation(); openArt(art); };
    nodes.appendChild(node);
    setTimeout(() => { node.style.transition = 'opacity .5s'; node.style.opacity = '1'; }, 80 + index * 80);
  });
}

/* =========================================================
   詳細カード
   ========================================================= */
const sheet = document.getElementById('sheet');
function openArt(art){
  const sheetImg = document.getElementById('sheetImage');
  sheetImg.innerHTML = art.thumb
    ? `<img src="${art.thumb}" alt="" onerror="console.warn('画像読み込み失敗:', '${art.name}')">`
    : '';
  document.getElementById('sheetTitle').textContent = art.name;
  document.getElementById('sheetCategory').textContent = art.maker;
  document.getElementById('sheetDescription').textContent = art.desc;
  const tags = document.getElementById('sheetTags');
  tags.innerHTML = '';
  art.tags.forEach(tag => {
    const el = document.createElement('div');
    el.className = 'tag'; el.textContent = tag;
    tags.appendChild(el);
  });
  sheet.classList.add('show');
}
function closeSheet(){ sheet.classList.remove('show'); }

/* =========================================================
   カメラ(パン・ピンチズーム・慣性)
   ========================================================= */
const world = document.getElementById('world');
let scale = 1, worldX = 0, worldY = 0;
let velocityX = 0, velocityY = 0, lastX = 0, lastY = 0, inertiaFrame = null;

const DEPTH_FAR = .18, DEPTH_MID = .42, DEPTH_NEAR = .7;

function applyTransform(){
  world.style.transform = `translate3d(${worldX}px, ${worldY}px, 0) scale(${scale})`;
  pFar.style.transform  = `translate3d(${worldX*DEPTH_FAR}px, ${worldY*DEPTH_FAR}px, 0) scale(${.72+.08*scale})`;
  pMid.style.transform  = `translate3d(${worldX*DEPTH_MID}px, ${worldY*DEPTH_MID}px, 0) scale(${.82+.1*scale})`;
  pNear.style.transform = `translate3d(${worldX*DEPTH_NEAR}px, ${worldY*DEPTH_NEAR}px, 0) scale(${.92+.08*scale})`;
  updateZoomLabel();
}

function updateZoomLabel(){
  const label = document.getElementById('zoomText');
  if (scale < .7) label.textContent = 'DEEP SPACE';
  else if (scale < 1.3) label.textContent = 'GALAXY VIEW';
  else if (scale < 2.4) label.textContent = 'GENRE REGION';
  else if (scale < 3.2) label.textContent = 'ART CONSTELLATION';
  else label.textContent = 'MICRO COSMOS';
}

function inertia(){
  if (Math.abs(velocityX) < .05 && Math.abs(velocityY) < .05) return;
  worldX += velocityX; worldY += velocityY;
  velocityX *= .92; velocityY *= .92;
  applyTransform();
  inertiaFrame = requestAnimationFrame(inertia);
}

let dragging = false, startX = 0, startY = 0, startWorldX = 0, startWorldY = 0;
const space = document.getElementById('space');

space.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch') return;
  dragging = true;
  startX = e.clientX; startY = e.clientY;
  startWorldX = worldX; startWorldY = worldY;
  lastX = e.clientX; lastY = e.clientY;
  velocityX = 0; velocityY = 0;
});
window.addEventListener('pointermove', e => {
  if (!dragging) return;
  worldX = startWorldX + e.clientX - startX;
  worldY = startWorldY + e.clientY - startY;
  velocityX = e.clientX - lastX; velocityY = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  applyTransform();
});
window.addEventListener('pointerup', () => {
  if (!dragging) return;
  dragging = false;
  cancelAnimationFrame(inertiaFrame);
  inertiaFrame = requestAnimationFrame(inertia);
});

let touches = [], pinchStartDistance = 0, pinchStartScale = 1;
let pinchCenterX = 0, pinchCenterY = 0, pinchWorldX = 0, pinchWorldY = 0;

space.addEventListener('touchstart', e => {
  touches = [...e.touches];
  if (touches.length === 2){
    pinchStartDistance = distance(touches[0], touches[1]);
    pinchStartScale = scale;
    pinchCenterX = (touches[0].clientX + touches[1].clientX)/2;
    pinchCenterY = (touches[0].clientY + touches[1].clientY)/2;
    pinchWorldX = worldX; pinchWorldY = worldY;
  } else if (touches.length === 1){
    startX = touches[0].clientX; startY = touches[0].clientY;
    startWorldX = worldX; startWorldY = worldY;
    lastX = startX; lastY = startY;
    velocityX = 0; velocityY = 0;
  }
}, { passive:false });

space.addEventListener('touchmove', e => {
  e.preventDefault();
  touches = [...e.touches];
  if (touches.length === 2){
    const d = distance(touches[0], touches[1]);
    const oldScale = scale;
    scale = clamp(pinchStartScale * (d / pinchStartDistance), .42, 4.5);
    // ピンチした場所を中心にズームする(Google Maps的な挙動)
    const cx = (touches[0].clientX + touches[1].clientX)/2;
    const cy = (touches[0].clientY + touches[1].clientY)/2;
    const worldPointX = (pinchCenterX - pinchWorldX) / oldScale;
    const worldPointY = (pinchCenterY - pinchWorldY) / oldScale;
    worldX = cx - worldPointX * scale;
    worldY = cy - worldPointY * scale;
    applyTransform();
  } else if (touches.length === 1){
    const x = touches[0].clientX, y = touches[0].clientY;
    worldX = startWorldX + x - startX;
    worldY = startWorldY + y - startY;
    velocityX = x - lastX; velocityY = y - lastY;
    lastX = x; lastY = y;
    applyTransform();
  }
}, { passive:false });

space.addEventListener('touchend', () => {
  if (touches.length === 1){
    cancelAnimationFrame(inertiaFrame);
    inertiaFrame = requestAnimationFrame(inertia);
  }
  touches = [];
}, { passive:true });

function distance(a,b){ return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); }
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

function zoomIn(){ scale = clamp(scale*1.35, .42, 4.5); applyTransform(); }
function zoomOut(){ scale = clamp(scale/1.35, .42, 4.5); applyTransform(); }

function resetView(){
  scale = 0.52; // 全体の星座が画面内に収まるよう、少し引いた視点で開始する
  const rect = space.getBoundingClientRect();
  worldX = rect.width/2 - CENTER*scale;
  worldY = rect.height/2 - CENTER*scale;
  document.querySelectorAll('.art-node').forEach(e => e.remove());
  document.querySelectorAll('.constellation-line.sub').forEach(e => e.remove());
  document.querySelectorAll('.preview-thumb').forEach(e => e.remove());
  buildPreviewThumbs();
  closeSheet();
  applyTransform();
}

resetView();
loadUniverse();
</script>
