<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>GALAXY OF NAIL — Plan.nail Taxonomy</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Kosugi&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#efe9f2;--dim:rgba(239,233,242,.55);--line:rgba(239,233,242,.18);--acc:#d9c6e8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#05050a;color:var(--ink);font-family:'Inter','Kosugi',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
/* 上のタイトル */
.top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 18px) 18px 0;text-align:center;pointer-events:none;z-index:5}
.top h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(17px,5vw,24px);letter-spacing:.26em;padding:0 46px}
.top p{font-size:9px;letter-spacing:.42em;color:var(--dim);margin-top:4px}
/* 右上のボタン */
.tools{position:fixed;top:calc(env(safe-area-inset-top) + 16px);right:14px;display:flex;flex-direction:column;gap:8px;z-index:6}
.tools button,.back{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(10,10,18,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--ink);font-size:15px;cursor:pointer}
.back{position:fixed;top:calc(env(safe-area-inset-top) + 16px);left:14px;z-index:6;display:none;font-size:16px}
.zoom{position:fixed;right:28px;top:calc(env(safe-area-inset-top) + 118px);width:2px;height:90px;background:var(--line);z-index:6;border-radius:2px}
.zoom i{position:absolute;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--ink);transition:top .2s}
/* 3Dのラベル(本物の文字) */
.lbl{position:fixed;left:0;top:0;transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap;z-index:3;transition:opacity .3s}
.lbl.planet{font-family:'Cormorant Garamond',serif;font-size:19px;letter-spacing:.14em;text-shadow:0 0 12px rgba(0,0,0,.9)}
.lbl.sat{font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.06em;color:#e6dcea;text-shadow:0 0 8px #000}
.lbl.small{font-size:10px;letter-spacing:.12em;color:var(--dim);text-shadow:0 0 8px #000}
/* 下のタブ */
.tabs{position:fixed;left:0;right:0;bottom:0;padding:10px 8px calc(env(safe-area-inset-bottom) + 12px);display:flex;justify-content:space-around;z-index:6;
  background:linear-gradient(to top,rgba(5,5,10,.85),rgba(5,5,10,0))}
.tabs button{background:none;border:none;color:var(--dim);font-size:9.5px;letter-spacing:.18em;padding:8px 2px;cursor:pointer;font-family:'Inter',sans-serif}
.tabs button.on{color:var(--ink)}
/* 詳細・一覧のシート */
.sheet{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 58px);max-width:520px;margin:0 auto;max-height:46vh;overflow:auto;z-index:7;
  padding:16px 16px 14px;border-radius:22px;
  /* ほぼ透明のリキッドグラス(サイトと同じガラスの設定)。後ろの惑星が透けて見える */
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.015) 45%,rgba(255,255,255,.04));
  backdrop-filter:blur(2.5px) saturate(172%) brightness(1.08);-webkit-backdrop-filter:blur(2.5px) saturate(172%) brightness(1.08);
  border:1px solid rgba(255,255,255,.17);
  box-shadow:inset 0 1.5px 2px rgba(255,255,255,.45), inset 0 -8px 16px -8px rgba(255,255,255,.22), 0 20px 40px -18px rgba(0,0,0,.6);
  transform:translateY(130%);transition:transform .45s cubic-bezier(.2,.9,.25,1);touch-action:pan-y}
.sheet.show{transform:none}
.sheet .x{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer}
.sheet *{text-shadow:0 1px 6px rgba(0,0,0,.75),0 0 2px rgba(0,0,0,.6);}
.sheet small{display:block;font-size:9px;letter-spacing:.28em;color:var(--dim)}
.sheet h2{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:26px;letter-spacing:.08em;margin:4px 0 2px}
.sheet .jp{font-family:'Kosugi',sans-serif;font-size:12px;color:var(--acc)}
.sheet p{font-family:'Kosugi',sans-serif;font-size:12.5px;line-height:1.8;color:#d8d0dc;margin-top:8px}
.sheet h3{font-size:9px;letter-spacing:.28em;color:var(--dim);font-weight:400;margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-family:'Cormorant Garamond',serif;font-size:13.5px;letter-spacing:.04em;padding:5px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.04);box-shadow:inset 0 1px 1px rgba(255,255,255,.3);color:var(--ink);cursor:pointer}
.chips button.link{border-color:rgba(217,198,232,.5)}
.hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 64px);text-align:center;font-size:10px;letter-spacing:.2em;color:var(--dim);z-index:4;pointer-events:none;transition:opacity 1s}
.closing{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 84px);text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;color:var(--dim);z-index:4;pointer-events:none;transition:opacity 1s}
.load{position:fixed;inset:0;background:#05050a;display:flex;align-items:center;justify-content:center;z-index:20;font-family:'Cormorant Garamond',serif;letter-spacing:.3em;font-size:14px;color:var(--dim);transition:opacity .8s}

/* ── 作品ギャラリー(月を選ぶと、ガラスのパネルが奥行きをもって浮かぶ) ── */
.gallery{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 92px);height:42vh;z-index:5;display:none;perspective:900px}
.gallery.show{display:block}
.gal-rail{height:100%;display:flex;align-items:center;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 calc(50% - 26vw);scrollbar-width:none;touch-action:pan-x}
.gal-rail::-webkit-scrollbar{display:none}
.panel{flex:0 0 52vw;max-width:260px;height:88%;scroll-snap-align:center;scroll-snap-stop:always;border-radius:16px;position:relative;cursor:pointer;
  background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.2);
  backdrop-filter:blur(2.5px) saturate(172%) brightness(1.08);-webkit-backdrop-filter:blur(2.5px) saturate(172%) brightness(1.08);
  box-shadow:inset 0 1.5px 2px rgba(255,255,255,.4),0 26px 50px -18px rgba(0,0,0,.75);transform-style:preserve-3d;transition:opacity .2s;will-change:transform;overflow:hidden}
.panel img{position:absolute;inset:10px 10px 34px;width:calc(100% - 20px);height:calc(100% - 44px);object-fit:contain;display:block}
.panel span{position:absolute;left:12px;right:12px;bottom:10px;font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.06em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 6px #000}
.panel.empty{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;cursor:default}
.panel.empty b{font-weight:400;font-family:'Cormorant Garamond',serif;font-size:15px;letter-spacing:.3em;color:var(--dim)}
.panel.empty i{font-style:normal;font-size:10px;color:var(--dim);font-family:'Kosugi'}
/* 惑星を選んだとき、まわりに浮かぶ小さな作品 */
.orbit-thumb{position:fixed;left:0;top:0;width:46px;height:58px;border-radius:9px;z-index:3;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .5s;
  border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.04);box-shadow:0 10px 20px -8px rgba(0,0,0,.7)}
.orbit-thumb img{width:100%;height:100%;object-fit:contain}
/* 作品の詳細(全画面)。開いている間は宇宙の操作を止める */
.art{position:fixed;inset:0;z-index:30;display:none;background:rgba(4,4,8,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.art.show{display:block}
.art-stage{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 56px);height:56vh;overflow:hidden;touch-action:none;display:flex;align-items:center;justify-content:center}
.art-stage img{max-width:92%;max-height:100%;object-fit:contain;transform-origin:center;transition:transform .15s;border-radius:6px;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.art-close{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font-size:18px;z-index:2}
.art-count{position:absolute;top:calc(env(safe-area-inset-top) + 22px);left:18px;font-size:10px;letter-spacing:.25em;color:var(--dim)}
.art-info{position:absolute;left:0;right:0;bottom:0;max-height:34vh;overflow:auto;padding:14px 20px calc(env(safe-area-inset-bottom) + 18px);touch-action:pan-y}
.art-info h2{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:24px;letter-spacing:.08em}
.art-info dl{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;margin-top:10px;font-size:11px}
.art-info dt{letter-spacing:.22em;color:var(--dim);font-size:9px;padding-top:3px}
.art-info dd{font-family:'Cormorant Garamond','Kosugi',serif;font-size:14px;letter-spacing:.04em}
.art-info p{font-family:'Kosugi';font-size:12px;line-height:1.8;color:#d8d0dc;margin-top:10px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="load" id="load">ENTERING THE GALAXY…</div>
<div class="top"><h1>GALAXY OF NAIL</h1><p>PLAN.NAIL TAXONOMY</p></div>
<button class="back" id="back" aria-label="宇宙に戻る">←</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   NAIL ART UNIVERSE — COSMIC WORLD EXPANSION
   PLANETS=5大分類(恒久) / MOONS=サブジャンル / COMETS=トレンド(移ろう)
   ASTEROIDS=モチーフ / NEBULAE=質感・技法 / CONSTELLATIONS=ジャンル同士の関係
   ============================================================ */

/* ---------- 1. タキソノミーのデータ(描画と分離。ここを書き換えれば宇宙に反映) ---------- */
const TAXONOMY = {

    { id:'metallic', type:'planet', name:'METALLIC', jp:'質感・構造', concept:'MATERIAL / STRUCTURE', material:'chrome',
      desc:'マグネット、クロム、クリア。素材そのものの質感と、光の構造で見せるジャンル。', pos:[9,3.5,-3], size:2.6 },

    { id:'natural', type:'planet', name:'NATURAL', jp:'肌なじみ・時代を問わない', concept:'SKIN TONE / TIMELESS BEAUTY', material:'porcelain',

    { id:'revival', type:'planet', name:'REVIVAL', jp:'時代の再解釈', concept:'CULTURAL REINTERPRETATION', material:'holo',
      desc:'Y2K、パンク、平成ノスタルジー。過去の時代を、今の感覚で描き直すジャンル。', pos:[0,-6,6], size:2.6 },
  ],
  subcategories: [
    ['romantic',['Sheer','Pearl','Rose','Classic Romantic',{name:'Y2K Girlhood',children:['Fairy','Wishcore','Coconut Girl','Angelcore','Pink Glamour','Unicorn']}]],
    ['metallic',['Magnet','Chrome','Clear','Star Galaxy','Aurora','Bubble']],
    ['dark',['Gothic',{name:'Grunge',children:['Foggy','Smoke','Ink Art','Nuance Art']},{name:'Mystic',children:['Tarot','Astrology']},
             {name:'Cyber',children:['Cybersigilism','Cyber Tribal']},{name:'Street',children:['Graffiti','Hardcore']},{name:'Extreme',children:['Super-realistic']},'Piercing']],
    ['natural',['Nude','Beige','Milk','Clean Girl',{name:'Quiet Luxury',children:[]}]],
    ['revival',['Y2K','Mint','Punk','Mcbling','Y3K','2010s Swag',{name:'Kidcore',children:['Beads','Candy','Primary Colors','Miniature Food']}]],
  ],
  motifs: [
    { id:'patterns', type:'asteroid', name:'PATTERNS', jp:'柄', items:['Stripe','Dot','Swirl','Check','Leopard','Zebra','Tortoise'], related:[] },
    { id:'ethnic', type:'asteroid', name:'ETHNIC', jp:'民族柄', items:['Hawaiian','African','Mexican','Neo-Chinese'], related:[] },
    { id:'decoration', type:'asteroid', name:'DECORATION', jp:'素材装飾', items:['Lace','Bijou','Button','Feather','Clover','Tattoo Stencil','Ribbon','Heart','Music Notes','Cursive','Porcelain','Knit / Quilting'], related:[] },
    { id:'creatures', type:'asteroid', name:'CREATURES', jp:'生き物・キャラクター', items:['Alien','Animals','Characters'],
      related:[{to:'metallic',note:'Alien：可愛い・宇宙的 → METALLIC'},{to:'dark',note:'Alien：不気味・歪み → DARK'}] },
    { id:'flowers', type:'asteroid', name:'FLOWERS', jp:'花', items:['Rose','Orchid','Plumeria / Hibiscus','Blooming'],
      related:[{to:'romantic',note:'Rose：ロマンティックな解釈 → ROMANTIC'},{to:'dark',note:'Rose・Orchid：暗い植物の解釈 → DARK'}] },
    { id:'flame', type:'asteroid', name:'FLAME', jp:'炎', items:['Fire Flame','Hot Rod','Punk Rock'],
      related:[{to:'revival',note:'レトロ・ホットロッド → REVIVAL'},{to:'dark',note:'暗いグラフィティの炎 → DARK / Street'}] },
  ],
  textures: [
    { id:'glaze', type:'nebula', name:'GLAZE', jp:'グレーズ', color:['#f4e4d6','#fff6ee'], pos:[4,6,-8], related:['natural'], items:['Skin-like Shine','Creamy Gloss','Natural Translucency'],
      desc:'clean girl由来。肌なじみのいい、やわらかくクリーミーなツヤ。' },
    { id:'chrome', type:'nebula', name:'CHROME', jp:'クロム', color:['#cfd8e6','#8fa2c4'], pos:[14,8,-6], related:['metallic','revival'], items:['Mirror Shine','Ice Nails','Juicy Nails'],
      desc:'Y2K・ギャル文脈。鏡のような金属のツヤ。氷ネイル＝平面で光を反射、うるうるネイル＝内側から光がにじむ。' },
    { id:'sea', type:'nebula', name:'SEA', jp:'海', color:['#9fd8df','#7aa6e8'], pos:[6,-10,-2], related:['revival','romantic'], items:['Mermaidcore','Summer Siren'],
      desc:'貝殻やうろこ、水のゆらぎ。2026年夏のトレンド。' },
    { id:'tumblr', type:'nebula', name:'TUMBLR', jp:'Tumblr系', color:['#b9a4e8','#f0b8d8'], pos:[-4,9,-9], related:['romantic','dark'], items:['Clouds','Galaxy','Large Glitter','Soft Grunge','Shooting Stars','Constellations','Rainbows','Scattered Hearts'],
      desc:'2010年代のTumblrの空気。雲、ギャラクシー、大粒のラメ、ソフトグランジ。' },
    { id:'grunge', type:'nebula', name:'GRUNGE TECHNIQUES', jp:'グランジの技法', color:['#8a7a8e','#4a3a52'], pos:[-15,-8,-2], related:['dark'], items:['Ink Art','Nuance Art','Blurred Textures','Marble'],
      desc:'にじみや大理石のような模様。輪郭が残るぶん、印象派とダブ音楽の中間のような表現。' },
  ],
  // トレンド=彗星。state: emerging(生まれたて) / active(いま輝く) / archived(アーカイブ。消さずに残す)
  trends: [
    { id:'rosalie', type:'comet', name:'Rosalie Core', state:'active', comet:'pearl', color:'#efc3d3', path:['romantic'], related:['romantic'],
      desc:'バラがモチーフの、ROMANTIC寄りのトレンド。西洋的で甘さのある花のコア。' },
    { id:'lotus', type:'comet', name:'Lotus Core', state:'emerging', comet:'crystal', color:'#bfe3d6', path:['romantic','natural'], related:['romantic','natural'],
      desc:'蓮・水・翡翠。オリエンタルで鉱物のような質感のミント、印象派の現代版。Rosalie Coreの隣を進む。' },
    { id:'mauve', type:'comet', name:'Mauve', state:'active', comet:'nebula', color:'#b79ad6', path:['romantic','dark','revival'], related:['romantic','dark','revival'],
      desc:'くすみパープル・暗めパープルに、明るめパープルの差し色。解釈しだいで複数の惑星を行き来する。' },
    { id:'mintwave', type:'comet', name:'Mint (2025)', state:'archived', comet:'crystal', color:'#a8e0c8', path:['revival'], related:['revival'],
      desc:'平成ノスタルジーのミントの流行。Lotus Coreへと流れていった。アーカイブとして残している。' },

  // 星座=ジャンル同士の関係
  relationships: [
    { id:'c1', type:'constellation', a:'romantic', b:'metallic', name:'ROMANTIC ↔ METALLIC', note:'有機的な柔らかさ ⇔ 機械的な硬さ' },
    { id:'c2', type:'constellation', a:'dark', b:'natural', name:'DARK ↔ NATURAL', note:'内省 ⇔ 頑張ってない風の完璧' },
    { id:'c3', type:'constellation', a:'natural', b:'revival', name:'NATURAL ↔ REVIVAL', note:'頑張ってない風の完璧 ⇔ 時代の再解釈' },
  ],
};

/* ---------- 2. 3Dの準備 ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05050a, 0.010);
const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 700);
scene.add(new THREE.AmbientLight(0x5f5870, 0.6));
const core = new THREE.PointLight(0xfff1e6, 1.5, 140); scene.add(core);
const key = new THREE.DirectionalLight(0xffffff, 0.9); key.position.set(18, 22, 16); scene.add(key);
const rim = new THREE.DirectionalLight(0xa79cff, 0.5); rim.position.set(-22, 10, -14); scene.add(rim);

const rnd = (a,b)=> a + Math.random()*(b-a);
function canvasTex(w,h,draw){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h); const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; return t; }
function glowTex(color, soft){ return canvasTex(128,128,(g,w,h)=>{ const r=g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2); r.addColorStop(0,color); r.addColorStop(soft?.2:.35,color+'99'); r.addColorStop(1,'#00000000'); g.fillStyle=r; g.fillRect(0,0,w,h); }); }
// なめらかな疑似ノイズ(外部ライブラリなし)
function noise3(x,y,z){ return Math.sin(x*1.7+Math.sin(y*2.3))*.5 + Math.sin(y*1.9+Math.sin(z*1.3))*.3 + Math.sin(z*2.6+Math.sin(x*.9))*.2; }

// 映り込み用の環境(金属・パールの反射を自然に)

  if(pointers.size===2){ const [a,b]=[...pointers.values()]; pinchStart=Math.hypot(a.x-b.x,a.y-b.y); pinchRadius=goal.radius; } hideHint(); });
canvas.addEventListener('pointermove',e=>{ if(!pointers.has(e.pointerId)) return; const pr=pointers.get(e.pointerId), dx=e.clientX-pr.x, dy=e.clientY-pr.y; pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){ moved+=Math.abs(dx)+Math.abs(dy); goal.theta-=dx*.0055; goal.phi=Math.min(2.7,Math.max(.35,goal.phi-dy*.0045)); }
  else if(pointers.size===2){ const [a,b]=[...pointers.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); if(pinchStart>0) goal.radius=Math.min(LIMIT.max,Math.max(LIMIT.min,pinchRadius*pinchStart/d)); moved+=99; } });
function endPointer(e){ if(!pointers.has(e.pointerId)) return; pointers.delete(e.pointerId); if(pointers.size===0 && moved<10 && performance.now()-downAt<350){ const now=performance.now(), dbl=now-lastTap<320; lastTap=now; onTap(e.clientX,e.clientY,dbl); } }
canvas.addEventListener('pointerup',endPointer); canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('wheel',e=>{ e.preventDefault(); goal.radius=Math.min(LIMIT.max,Math.max(LIMIT.min,goal.radius*(1+e.deltaY*.001))); },{passive:false});
const ray=new THREE.Raycaster(); ray.params.Line.threshold=.45; const ndc=new THREE.Vector2();
function onTap(x,y,dbl){ ndc.set(x/innerWidth*2-1,-(y/innerHeight)*2+1); ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(clickables,false); if(!hits.length){ if(dbl) goal.radius=Math.max(LIMIT.min,goal.radius*.7); return; }
  // 星座の線は細いので、他に当たっていればそちらを優先(重要度の順)
  const order={planet:0,moon:1,comet:2,asteroid:3,nebula:4,constellation:5}; hits.sort((a,b)=>(order[a.object.userData.kind]-order[b.object.userData.kind])||(a.distance-b.distance));
  const o=hits[0].object, u=o.userData;
  if(u.kind==='planet') focusPlanet(u.data.id, dbl?4.2:7.5);
  else if(u.kind==='moon') openMoon(o); else if(u.kind==='asteroid') openAsteroid(u.data,o); else if(u.kind==='nebula') openNebula(u.data,o);
  else if(u.kind==='comet') openComet(u.data,o); else if(u.kind==='constellation') openConstellation(u.data); }

function openMoon(m){ const u=m.userData,P=u.planet; enterDetail(); openGallery(artworksFor('moon',u.name)); followObj=m; goal.radius=Math.min(goal.radius,5); setSelected(m,1.6); showLinks(wpos(m),[P.id]);

function openAsteroid(M,obj){ enterDetail(); followObj=obj; goal.radius=9; setSelected(obj,2.2); const ids=M.related.map(l=>l.to); showLinks(wpos(obj),ids); highlightConstellations(ids);

function openNebula(T,obj){ enterDetail(); followObj=null; goal.target.copy(wpos(obj)); goal.radius=10; setSelected(null); showLinks(wpos(obj),T.related); highlightConstellations(T.related);
  openSheet(`<small>NEBULA · 質感・仕上げ・技法</small><h2>${T.name}</h2><div class="jp">${T.jp}</div><p>${T.desc}</p>

const STATE_JP={ emerging:'EMERGING — 生まれたばかり', active:'ACTIVE — いま輝いている', archived:'ARCHIVED — アーカイブ' };

/* ============================================================
   13. 作品写真(NAIL ARTWORK)。NotionのトレンドデザインDBから読み込む
   「宇宙の惑星」「宇宙のサブジャンル」「モチーフタグ」「質感タグ」「トレンドタグ」「表示順」を付けるだけで、
   宇宙を作り直さずにギャラリーへ出る。1つの作品を複数の分類に入れてもOK
   ============================================================ */
let ARTWORKS = [];
const norm = s => String(s||'').trim().toLowerCase();
fetch('/api/notion?type=trends').then(r=>r.ok?r.json():[]).then(list=>{
  if(!Array.isArray(list)) return;
  ARTWORKS = list.filter(t=>t.universe && (t.universe.planets.length || t.universe.subgenres.length) && (t.thumb || (t.images&&t.images[0])))
    .map(t=>({ id:t.id, title:t.name||'', img:t.thumb||t.images[0], images:t.images||[t.thumb], thumb:t.thumbSmall||t.thumb, desc:t.desc||'',
      planets:t.universe.planets.map(norm), subgenres:t.universe.subgenres, motifs:t.universe.motifs, textures:t.universe.textures, trends:t.universe.trends, order:t.universe.order }))
    .sort((a,b)=>a.order-b.order);
}).catch(()=>{});
function artworksFor(kind, key){
  if(kind==='planet') return ARTWORKS.filter(a=>a.planets.includes(key));
  if(kind==='moon') return ARTWORKS.filter(a=>a.subgenres.some(s=>norm(s)===norm(key)));
  if(kind==='motif') return ARTWORKS.filter(a=>a.motifs.some(s=>norm(s)===norm(key)));
  if(kind==='texture') return ARTWORKS.filter(a=>a.textures.some(s=>norm(s)===norm(key)));
  if(kind==='trend') return ARTWORKS.filter(a=>a.trends.some(s=>norm(s)===norm(key)));
  return []; }

// ギャラリー:ガラスのパネルが奥行きをもって並び、横スワイプで見る
const gallery=document.getElementById('gallery'), galRail=document.getElementById('galRail');
let galItems=[];
function openGallery(items){ galItems=items; galRail.innerHTML='';
  if(!items.length){ galRail.innerHTML='<div class="panel empty"><b>AWAITING ARTWORK</b><i>作品の写真はこれから追加されます</i></div>'; }
  items.forEach((a,i)=>{ const p=document.createElement('div'); p.className='panel'; p.innerHTML=`<img loading="lazy" decoding="async" alt=""><span></span>`;
    p.querySelector('img').src=a.thumb||a.img; p.querySelector('span').textContent=a.title; p.onclick=()=>openArt(i); galRail.appendChild(p); });
  gallery.classList.add('show'); galRail.scrollLeft=0; requestAnimationFrame(updateGallery); }
function closeGallery(){ gallery.classList.remove('show'); galItems=[]; }
function updateGallery(){ const mid=galRail.scrollLeft+galRail.clientWidth/2;
  [...galRail.children].forEach((p,i)=>{ const off=(p.offsetLeft+p.offsetWidth/2-mid)/p.offsetWidth; const a=Math.min(1.5,Math.abs(off));
    // 奥行きの違う場所に浮いているように、少しずつ高さと奥行きをずらす
    const z=-90*a - (i%3)*18, y=(i%2?10:-10)*a, ry=Math.max(-24,Math.min(24,-off*22));
    p.style.transform=`translateY(${y}px) translateZ(${z}px) rotateY(${ry}deg)`; p.style.opacity=String(1-.4*Math.min(1,a)); }); }
galRail.addEventListener('scroll',()=>requestAnimationFrame(updateGallery),{passive:true});

// 作品の詳細(大きな写真+分類)。ピンチで拡大、横スワイプで前後の作品へ
const art=document.getElementById('art'), artImg=document.getElementById('artImg'), artInfo=document.getElementById('artInfo'), artStage=document.getElementById('artStage');
let artIndex=0, uiLock=false, zoom={s:1,x:0,y:0};
function openArt(i){ artIndex=i; uiLock=true; renderArt(); art.classList.add('show'); }
function closeArt(){ art.classList.remove('show'); uiLock=false; }
document.getElementById('artClose').onclick=closeArt;
function nameOf(id){ const p=planets[id]; return p?p.data.name:id.toUpperCase(); }
function renderArt(){ const a=galItems[artIndex]; if(!a) return; zoom={s:1,x:0,y:0}; applyZoom();
  artImg.src=a.img; document.getElementById('artCount').textContent=(artIndex+1)+' / '+galItems.length;
  const main=a.planets[0], rel=a.planets.slice(1);
  const row=(k,v)=>v&&v.length?`<dt>${k}</dt><dd>${Array.isArray(v)?v.join(' / '):v}</dd>`:'';
  artInfo.innerHTML=`<h2></h2><dl>${row('CATEGORY',main?nameOf(main):'')}${row('SUBCATEGORY',a.subgenres)}${row('MOTIFS',a.motifs)}${row('TEXTURE',a.textures)}${row('RELATED GENRES',rel.map(nameOf))}${row('TRENDS',a.trends)}</dl>${a.desc?'<p></p>':''}`;
  artInfo.querySelector('h2').textContent=a.title; if(a.desc) artInfo.querySelector('p').textContent=a.desc; }
function applyZoom(){ artImg.style.transform=`translate(${zoom.x}px,${zoom.y}px) scale(${zoom.s})`; }
(function artGestures(){ const pts=new Map(); let start=null, pinch0=0, s0=1, startX=0;
  artStage.addEventListener('pointerdown',e=>{ artStage.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){ start={x:e.clientX,y:e.clientY,zx:zoom.x,zy:zoom.y}; startX=e.clientX; }
    if(pts.size===2){ const [a,b]=[...pts.values()]; pinch0=Math.hypot(a.x-b.x,a.y-b.y); s0=zoom.s; } });
  artStage.addEventListener('pointermove',e=>{ if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){ const [a,b]=[...pts.values()]; zoom.s=Math.min(4,Math.max(1,s0*Math.hypot(a.x-b.x,a.y-b.y)/pinch0)); applyZoom(); }
    else if(pts.size===1 && zoom.s>1 && start){ zoom.x=start.zx+(e.clientX-start.x); zoom.y=start.zy+(e.clientY-start.y); applyZoom(); } });
  const end=e=>{ if(!pts.has(e.pointerId)) return; pts.delete(e.pointerId);
    if(pts.size===0 && zoom.s<=1.02 && start){ const dx=e.clientX-startX; // 拡大していないときだけ、横スワイプで前後の作品へ
      if(dx<-50 && artIndex<galItems.length-1){ artIndex++; renderArt(); } else if(dx>50 && artIndex>0){ artIndex--; renderArt(); } }
    if(zoom.s<=1.02){ zoom={s:1,x:0,y:0}; applyZoom(); } };
  artStage.addEventListener('pointerup',end); artStage.addEventListener('pointercancel',end);
  artStage.addEventListener('dblclick',()=>{ zoom = zoom.s>1 ? {s:1,x:0,y:0} : {s:2.2,x:0,y:0}; applyZoom(); });
})();

// 惑星を選んだとき、まわりに小さな作品が浮かび始める
const orbitThumbs=[]; for(let i=0;i<6;i++){ const d=document.createElement('div'); d.className='orbit-thumb'; d.innerHTML='<img alt="">'; document.body.appendChild(d); orbitThumbs.push(d); }
let orbitSet=[], orbitFor=null;
function refreshOrbitThumbs(){ const id = (mode==='planet' && focus) ? focus : null;
  if(id!==orbitFor){ orbitFor=id; orbitSet = id ? artworksFor('planet',id).slice(0,6) : []; orbitThumbs.forEach((d,i)=>{ const a=orbitSet[i]; if(a) d.querySelector('img').src=a.thumb||a.img; }); } }
function updateOrbitThumbs(t){ refreshOrbitThumbs();
  orbitThumbs.forEach((d,i)=>{ const a=orbitSet[i]; if(!a || !orbitFor || uiLock){ d.style.opacity=0; return; }
    const p=planets[orbitFor]; const ang=t*.15 + i/orbitSet.length*Math.PI*2, R=p.data.size*2.9;
    v3.set(Math.cos(ang)*R, Math.sin(ang*2)*.8, Math.sin(ang)*R).add(p.group.position); v3.project(camera);
    if(v3.z>1){ d.style.opacity=0; return; }
    d.style.opacity=.92; d.style.transform=`translate(-50%,-50%) translate(${(v3.x*.5+.5)*innerWidth}px,${(-v3.y*.5+.5)*innerHeight}px)`; }); }

/* ---------- 12. 毎フレーム ---------- */
const v3=new THREE.Vector3(), zoomDot=document.getElementById('zoomDot');
let hintHidden=false; function hideHint(){ if(hintHidden) return; hintHidden=true; document.getElementById('hint').style.opacity=0; document.getElementById('closing').style.opacity=0; }
function labelVisible(L){ const s=L.show; if(s==='always') return true;
  if(s.startsWith('planet:')) return (mode!=='universe'&&focus===s.slice(7)) || camera.position.distanceTo(wpos(L.obj))<12;
  if(s==='asteroids') return tab==='motifs'||mode==='detail'||cam.radius>40;
  if(s==='nebulae') return tab==='textures'||cam.radius<24;
  if(s==='comets') return tab==='trends'||selected===L.obj||cam.radius<28;
  if(s==='archive') return tab==='trends'||camera.position.distanceTo(archiveSpot)<40;
  return false; }
let last=performance.now(), frame=0;
function tick(now){ const dt=Math.min(.05,(now-last)/1000), t=now/1000; last=now; frame++;
  if(followObj) goal.target.copy(wpos(followObj));
  cam.target.lerp(goal.target,.07); cam.radius+=(goal.radius-cam.radius)*.07; cam.theta+=(goal.theta-cam.theta)*.12; cam.phi+=(goal.phi-cam.phi)*.12; applyCamera();
  Object.values(planets).forEach(p=>{ p.body.rotation.y+=p.spin*dt; p.moonG.rotation.y+=dt*.12;
    if(p.body.userData.liquid && frame%2===0) updateLiquid(p.body.userData.liquid,t);
    if(p.body.userData.holo && frame%3===0){ updateHolo(p.body.userData.holo,t); p.body.userData.frag.rotation.y-=dt*.2; }
    if(p.body.userData.iri) p.body.userData.iri.sheen.setHSL((.92+Math.sin(t*.3)*.06)%1,.5,.82); });
  belt.rotation.y+=dt*.02; asteroids.forEach(a=>{ const s=a.userData.spin; a.rotation.x+=s.x*dt; a.rotation.y+=s.y*dt; a.rotation.z+=s.z*dt; });
  nebulae.forEach((g,i)=>g.children.forEach((s,k)=>{ if(s.isSprite){ s.material.rotation+=dt*.02*(k%2?1:-1); s.material.opacity=.18+Math.sin(t*.4+i+k)*.06; } }));
  updateFragments(dt);
  trendComets.forEach(c=>c.update(dt));
  for(let i=ambient.length-1;i>=0;i--){ if(!ambient[i].update(dt)){ ambient[i].dispose(); ambient.splice(i,1); } }
  nextAmbient-=dt; if(nextAmbient<=0 && ambient.length<3){ spawnAmbient(); nextAmbient=rnd(6,14); }
  archive.forEach((a,i)=>{ a.sprite.material.opacity=.25+Math.sin(t*.5+i)*.08; });
  if(selected){ halo.position.copy(wpos(selected)); halo.material.opacity=.28+Math.sin(t*2)*.08; }
  centerStar.material.rotation+=dt*.05;
  renderer.render(scene,camera);
  labels.forEach(L=>{ L.obj.getWorldPosition(v3); const d=camera.position.distanceTo(v3); v3.project(camera);
    const on=v3.z<1&&labelVisible(L)&&Math.abs(v3.x)<1.1&&Math.abs(v3.y)<1.1;
    L.el.style.opacity=on?(L.show==='always'?Math.max(.25,Math.min(1,60/d)):1):0;
    if(on){ const off=L.show==='always'?0:-16; L.el.style.transform=`translate(-50%,-50%) translate(${(v3.x*.5+.5)*innerWidth}px,${(-v3.y*.5+.5)*innerHeight+off}px)`; } });
  updateOrbitThumbs(t);
  zoomDot.style.top=(1-(cam.radius-LIMIT.min)/(LIMIT.max-LIMIT.min))*82+'px';
  requestAnimationFrame(tick); }
addEventListener('resize',()=>{ renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); });
requestAnimationFrame(t=>{ document.getElementById('load').style.opacity=0; setTimeout(()=>document.getElementById('load').remove(),900); last=t; tick(t); });
setTimeout(hideHint,9000);
</script>
</body>
</html>
